<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-1: #04141f;
    --bg-2: #06263a;
    --bg-3: #073c52;
    --ink: #f2fbff;
    --ink-2: rgba(242,251,255,0.72);
    --ink-3: rgba(242,251,255,0.5);
    --glass: rgba(255,255,255,0.06);
    --glass-strong: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.14);
    --accent: #00bfea;
    --accent-2: #14cfa8;
    --accent-3: #ffd24a;
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
    --ratio: 2.1363; /* 5046 / 2362 */
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Inter", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% 6%, rgba(0,191,234,0.20), transparent 44%),
      radial-gradient(circle at 90% 14%, rgba(20,207,168,0.16), transparent 48%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 54%, var(--bg-3) 100%);
    height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- Top brand bar ---------- */
  .brand-bar {
    flex: 0 0 auto; position: relative; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 18px; padding-top: max(12px, env(safe-area-inset-top));
  }
  .brand-mark { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-mark .eyebrow {
    font-size: 10px; letter-spacing: 2.5px; color: var(--ink-3);
    font-weight: 600; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-mark .title {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(90deg, #fff 0%, #b9f0ff 50%, #9df0dd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 0.4px;
  }
  .brand-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .icon-btn {
    appearance: none; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--ink);
    width: 38px; height: 38px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 200ms var(--spring);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--glass-strong); transform: translateY(-1px); outline: none; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ---------- Hint pill ---------- */
  .hint {
    flex: 0 0 auto; position: relative; z-index: 2;
    margin: 0 auto 4px; max-width: 1200px; width: 100%;
    padding: 0 18px;
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: var(--ink-2);
  }
  .hint .badge {
    background: var(--glass); padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--glass-border);
    font-weight: 700; letter-spacing: 0.5px; color: var(--accent); flex: 0 0 auto;
  }
  .hint span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: var(--accent); box-shadow: 0 0 12px var(--accent);
    animation: dotPulse 1600ms ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.75); } }

  /* ---------- Map (fixed top pane) ---------- */
  .map-stage { flex: 0 0 auto; position: relative; z-index: 1; width: 100%; padding: 4px 12px 8px; }
  .map-row { width: 100%; max-width: min(1200px, calc(34vh * var(--ratio))); margin: 0 auto; }
  .map-frame {
    position: relative; width: 100%;
    border-radius: 18px; overflow: hidden;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.45);
    aspect-ratio: 5046 / 2362;
  }
  .map-base { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .map-overlay { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hit {
    fill: rgba(255,255,255,0.001);
    stroke: rgba(255,255,255,0); stroke-width: 8;
    cursor: pointer; pointer-events: all;
    transition: fill 220ms ease, stroke 220ms ease, filter 240ms var(--spring);
  }
  .zone-group { outline: none; }
  .zone-group:hover .hit, .zone-group:focus-visible .hit {
    fill: color-mix(in srgb, var(--zc, var(--accent)) 24%, transparent);
    stroke: var(--zc, var(--accent)); stroke-width: 10;
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--zc) 70%, transparent));
  }
  /* clicked region lights up — no dimming mask over the rest */
  .zone-group.active .hit {
    fill: color-mix(in srgb, var(--zc) 36%, transparent);
    stroke: var(--zc); stroke-width: 13;
    filter: drop-shadow(0 0 14px var(--zc)) drop-shadow(0 0 26px color-mix(in srgb, var(--zc) 55%, transparent));
  }
  .map-overlay.intro .zone-group .hit { animation: introPulse 2400ms var(--spring) 1 both; }
  @keyframes introPulse {
    0%, 100% { fill: rgba(255,255,255,0.001); stroke: transparent; filter: none; }
    22%, 50% { fill: color-mix(in srgb, var(--zc) 16%, transparent); stroke: var(--zc); stroke-width: 10; filter: drop-shadow(0 0 9px color-mix(in srgb, var(--zc) 60%, transparent)); }
  }

  /* ---------- Floating hover label ---------- */
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .zlabel {
    position: absolute; transform: translate(-50%, -50%) scale(0.92);
    display: flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(4,20,31,0.88); color: var(--ink);
    font-size: 12px; font-weight: 700; letter-spacing: 0.3px;
    border: 1px solid var(--zc, var(--glass-border));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 18px color-mix(in srgb, var(--zc) 45%, transparent);
    white-space: nowrap; opacity: 0; transition: opacity 200ms var(--spring), transform 200ms var(--spring);
  }
  .zlabel.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .zlabel .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--zc); box-shadow: 0 0 10px var(--zc); flex: 0 0 auto; }
  .zlabel .go { font-size: 11px; color: var(--zc); font-weight: 800; }

  /* ---------- Inline info panel (bottom) ---------- */
  .panel {
    flex: 1 1 auto; min-height: 0; position: relative; z-index: 2;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(7,44,62,0.6), rgba(4,20,31,0.2));
    border-top: 1px solid var(--glass-border);
  }
  .panel-inner {
    width: 100%; max-width: 760px; margin: 0 auto;
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  }
  .panel-head {
    flex: 0 0 auto; display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 18px 10px; position: relative;
  }
  .sheet-accent { width: 5px; align-self: stretch; min-height: 42px; border-radius: 999px; background: var(--zc, var(--accent)); box-shadow: 0 0 16px var(--zc); flex: 0 0 auto; transition: background 300ms ease; }
  .sheet-titles { flex: 1 1 auto; min-width: 0; }
  .sheet-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--zc, var(--accent)); transition: color 300ms ease; }
  .sheet-title { font-size: 21px; font-weight: 800; line-height: 1.18; margin-top: 2px; }
  .sheet-title-en { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  .panel-body { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 2px 0 10px; display: flex; flex-direction: column; }

  /* slide-up-in animation on content change */
  @keyframes slideUpIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .panel-body.playing .anim { animation: slideUpIn 460ms var(--spring) both; }
  .panel-body.playing .anim:nth-child(1) { animation-delay: 20ms; }
  .panel-body.playing .anim:nth-child(2) { animation-delay: 80ms; }
  .panel-body.playing .anim:nth-child(3) { animation-delay: 140ms; }
  .panel-body.playing .anim:nth-child(4) { animation-delay: 200ms; }

  /* zone view */
  .sheet-blurb { font-size: 14px; color: var(--ink-2); margin-bottom: 16px; }
  .section-label { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink-3); text-transform: uppercase; margin-bottom: 10px; }
  .highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .hl { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-radius: 13px; background: var(--glass); border: 1px solid var(--glass-border); font-size: 13px; font-weight: 600; }
  .hl .hl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--zc, var(--accent)); box-shadow: 0 0 8px var(--zc); flex: 0 0 auto; }

  /* stage / schedule view */
  .day-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .day-tab {
    flex: 1 1 0; appearance: none; cursor: pointer; padding: 9px 6px; border-radius: 13px;
    background: var(--glass); border: 1px solid var(--glass-border); color: var(--ink-2);
    font-size: 13px; font-weight: 700; line-height: 1.25;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    transition: all 180ms var(--spring);
  }
  .day-tab .dow { font-size: 10px; font-weight: 600; color: var(--ink-3); }
  .day-tab:hover { background: var(--glass-strong); }
  .day-tab.active { background: color-mix(in srgb, var(--zc) 22%, transparent); border-color: var(--zc); color: #fff; box-shadow: 0 0 16px color-mix(in srgb, var(--zc) 40%, transparent); }
  .day-tab.active .dow { color: rgba(255,255,255,0.85); }
  .schedule { display: flex; flex-direction: column; gap: 9px; }
  .sch-item { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-border); }
  .sch-time { flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--zc, var(--accent)); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; min-width: 84px; }
  .sch-main { flex: 1 1 auto; min-width: 0; }
  .sch-title { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .sch-sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
  .lang { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.5px; padding: 1px 5px; border-radius: 4px; line-height: 1.5; }
  .lang.zh { background: rgba(255,255,255,0.16); color: var(--ink); }
  .lang.en { background: #e8283f; color: #fff; }
  .sch-empty { padding: 26px 14px; text-align: center; color: var(--ink-3); font-size: 13px; }

  /* ">>" swipe hint next to the title */
  .sheet-title-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .zone-more {
    appearance: none; cursor: pointer; flex: 0 0 auto;
    border: 1px solid var(--zc); color: var(--zc);
    background: color-mix(in srgb, var(--zc) 20%, transparent);
    font-weight: 900; font-size: 15px; line-height: 1; letter-spacing: -1px;
    padding: 4px 11px; border-radius: 999px;
    animation: morePulse 1400ms ease-in-out infinite;
  }
  /* hidden via visibility so the title row never reflows mid-scroll */
  .zone-more.off { visibility: hidden; animation: none; }
  @keyframes morePulse { 0%,100% { transform: translateX(0); opacity: 1; } 50% { transform: translateX(4px); opacity: 0.55; } }

  /* ---------- 2-page carousel (info + zoomed map) ---------- */
  .carousel { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: center; min-width: 0; height: 100%; }
  .slide.info-slide { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 18px 6px; }
  .slide.map-slide { display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2px 14px 6px; }
  .slide-img-wrap { width: 100%; display: flex; align-items: flex-start; justify-content: center; }
  .slide.map-slide img { width: 100%; height: auto; object-fit: contain; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); display: block; }
  .carousel-dots { flex: 0 0 auto; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 10px 0 4px; }
  .cdot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); cursor: pointer; transition: all 200ms var(--spring); border: none; padding: 0; }
  .cdot::after { content: ''; position: absolute; inset: -14px; } /* larger tap target */
  .cdot.active { background: var(--zc, var(--accent)); width: 22px; border-radius: 999px; }

  body[data-mode="stage"] #zoneView { display: none; }
  body[data-mode="zone"]  #stageView { display: none; }

  /* ---------- Legend modal ---------- */
  .legend { position: fixed; inset: 0; background: rgba(2,10,16,0.72); display: none; align-items: center; justify-content: center; z-index: 90; padding: 24px; backdrop-filter: blur(8px); }
  .legend[data-open="true"] { display: flex; }
  .legend-card { width: 100%; max-width: 460px; background: linear-gradient(180deg, rgba(6,38,58,0.98), rgba(4,20,31,0.99)); border: 1px solid var(--glass-border); border-radius: 20px; padding: 22px; box-shadow: var(--shadow-lg); max-height: 84vh; overflow-y: auto; animation: legendIn 320ms var(--spring); }
  @keyframes legendIn { from { transform: translateY(16px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
  .legend-card h2 { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
  .legend-card .sub { color: var(--ink-2); font-size: 12px; margin-bottom: 14px; }
  .legend-group-label { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink-3); text-transform: uppercase; margin: 14px 4px 6px; }
  .legend-group-label:first-child { margin-top: 4px; }
  .legend-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; cursor: pointer; border: 1px solid transparent; transition: background 160ms ease, border-color 160ms ease, transform 160ms var(--spring); }
  .legend-item:hover, .legend-item:focus-visible { background: var(--glass); border-color: var(--zc, var(--glass-border)); outline: none; transform: translateX(2px); }
  .legend-swatch { width: 16px; height: 16px; border-radius: 5px; flex: 0 0 auto; box-shadow: 0 0 12px currentColor; }
  .legend-name { font-weight: 700; font-size: 14px; }
  .legend-desc { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
  .legend-tag { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--zc); flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--zc); white-space: nowrap; }
  .btn { appearance: none; cursor: pointer; padding: 13px 16px; border-radius: 14px; font-size: 14px; font-weight: 800; letter-spacing: 0.3px; border: 1px solid var(--glass-border); transition: transform 160ms var(--spring), background 160ms ease; }
  .btn:active { transform: scale(0.98); }
  .btn-ghost { background: var(--glass); color: var(--ink); }
  .btn-ghost:hover { background: var(--glass-strong); }

  /* ---------- Toast ---------- */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); z-index: 120; background: rgba(4,20,31,0.94); border: 1px solid var(--glass-border); color: var(--ink); padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity 260ms var(--spring), transform 260ms var(--spring); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Calibration overlay ---------- */
  .cal-grid line { stroke: rgba(0,255,255,0.25); stroke-width: 2; }
  .cal-grid line.major { stroke: rgba(255,80,80,0.45); }
  .cal-grid text { fill: #ffeb3b; font-size: 34px; }

  @media (min-width: 900px) {
    .brand-mark .title { font-size: 18px; }
    .map-row { max-width: min(1200px, calc(42vh * var(--ratio))); }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel-body.playing .anim { animation-duration: 1ms !important; }
    *, *::before, *::after { animation-duration: 0.001ms !important; }
  }
</style>
</head>
<body data-mode="stage">

      b.innerHTML = `${d.key}<span class="dow">星期${d.dow}</span>`;
      b.addEventListener('click', () => { currentDay = d.key; renderSchedule(z); refreshTabs(); });
      dayTabs.appendChild(b);
    });
  }
  function refreshTabs() { dayTabs.querySelectorAll('.day-tab').forEach(b => b.classList.toggle('active', b.dataset.day === currentDay)); }
  function renderSchedule(z) {
    const items = (SCHEDULE[z.key] && SCHEDULE[z.key][currentDay]) || [];
    scheduleList.innerHTML = '';
    if (!items.length) { scheduleList.innerHTML = '<div class="sch-empty">本日於此舞台無安排場次</div>'; return; }
    items.forEach(it => {
      const el = document.createElement('div'); el.className = 'sch-item';
      el.innerHTML = `<div class="sch-time">${it.t}</div><div class="sch-main">` +
        `<div class="sch-title">${it.title}${langTags(it.lang)}</div>` +
        `${it.sub ? `<div class="sch-sub">${it.sub}</div>` : ''}</div>`;
      scheduleList.appendChild(el);
    });
  }
  function firstDayWithSessions(key) { const f = DAYS.find(d => SCHEDULE[key] && SCHEDULE[key][d.key] && SCHEDULE[key][d.key].length); return f ? f.key : DAYS[0].key; }

  // ---------- Open spot (inline) ----------
  function openSpot(key, replace = true) {
    const z = ALL[key]; if (!z) return;
    Object.values(zlabels).forEach(l => l.classList.remove('show'));
    current = key;
    Object.entries(groups).forEach(([k, g]) => g.classList.toggle('active', k === key));

    document.documentElement.style.setProperty('--zc', z.color);
    $('.panel-inner').style.setProperty('--zc', z.color);
    sheetTitle.textContent = (z.code ? z.code + '｜' : '') + z.name;
    sheetTitleEn.textContent = z.nameEn;

    if (z.type === 'stage') {
      document.body.dataset.mode = 'stage';
      sheetEyebrow.textContent = '舞台與活動空間 · STAGE';
      currentDay = firstDayWithSessions(key);
      renderDayTabs(z); renderSchedule(z);
      setDotLabels(['節目表', '位置圖']);
    } else {
      document.body.dataset.mode = 'zone';
      sheetEyebrow.textContent = '展區 · ZONE';
      sheetBlurb.textContent = z.blurb;
      sheetHighlights.innerHTML = '';
      (z.highlights || []).forEach(h => { const el = document.createElement('div'); el.className = 'hl'; el.innerHTML = `<span class="hl-dot"></span>${h}`; sheetHighlights.appendChild(el); });
      setDotLabels(['展區介紹', '放大地圖']);
    }
    zoneMapImg.src = `assets/zone-${key}.webp`;
    zoneMapImg.alt = `${z.name} 位置放大圖`;
    jumpToPage(0); markDots(0);
    requestAnimationFrame(() => { jumpToPage(0); updateDots(); });
    playAnim();
    if (replace) history.replaceState({ spot: key }, '', '#spot=' + key);
  }

  // ---------- 2-page carousel (info + zoomed map) ----------
  // Jump instantly: an animated scroll on a `scroll-snap-type: mandatory`
  // container gets re-snapped back to the current page mid-flight in Chrome.
  // Touch swiping still animates natively.
  // markDots() is called here rather than left to the scroll listener, which
  // does not reliably fire for programmatic jumps.
  function scrollToPage(i) { carousel.scrollLeft = i * carousel.clientWidth; markDots(i); }
  const jumpToPage = scrollToPage;
  function markDots(idx) {
    [...carouselDots.children].forEach((d, i) => d.classList.toggle('active', i === idx));
    zoneMore.classList.toggle('off', idx !== 0);
  }
  function updateDots() { markDots(Math.round(carousel.scrollLeft / Math.max(1, carousel.clientWidth))); }
  ['資訊', '放大地圖'].forEach((lbl, i) => {
    const d = document.createElement('button'); d.className = 'cdot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', lbl);
    d.addEventListener('click', () => scrollToPage(i));
    carouselDots.appendChild(d);
  });
  function setDotLabels(labels) { [...carouselDots.children].forEach((d, i) => d.setAttribute('aria-label', labels[i])); }
  carousel.addEventListener('scroll', updateDots, { passive: true });
  zoneMore.addEventListener('click', () => scrollToPage(1));

  // ---------- Events ----------
  overlay.addEventListener('click', e => { const g = e.target.closest('.zone-group'); if (g) openSpot(g.dataset.zone); });
  overlay.addEventListener('keydown', e => { const g = e.target.closest('.zone-group'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSpot(g.dataset.zone); } });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && legend.dataset.open === 'true') legend.dataset.open = 'false';
  });

  $('#btnLegend').addEventListener('click', () => legend.dataset.open = 'true');
  $('#legendClose').addEventListener('click', () => legend.dataset.open = 'false');
  legend.addEventListener('click', e => { if (e.target === legend) legend.dataset.open = 'false'; });

  // ---------- Share ----------
  let toastTimer = null;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200); }
  async function shareMap(extraText = '', spotKey = '') {
    const base = location.origin + location.pathname;
    const url = spotKey ? `${base}#spot=${spotKey}` : base;
    const title = '2026 Meet Greater South 亞灣新創大南方 互動展區地圖';
    const text = extraText || '快來探索展區介紹與舞台節目表!';
    if (window.liff && liff.isInClient && liff.isInClient()) { try { await liff.shareTargetPicker([{ type:'text', text:`${title}\n${text}\n${url}` }]); return; } catch (err) {} }
    if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (err) { return; } }
    try { await navigator.clipboard.writeText(`${title} ${url}`); toast('連結已複製到剪貼簿'); } catch (err) { prompt('複製此連結分享:', url); }
  }
  $('#btnShare').addEventListener('click', () => shareMap('', current || ''));

  // ---------- Intro reveal + load ----------
  const baseImg = mapFrame.querySelector('.map-base');

  // Chrome can commit a frame before the map image finishes decoding and then
  // never repaint it — the frame stays blank even though the image is loaded.
  // Touching a paint-only property once the decode resolves forces the repaint.
  function repaintBase() {
    baseImg.style.opacity = '0.999';
    requestAnimationFrame(() => requestAnimationFrame(() => { baseImg.style.opacity = ''; }));
  }
  function ensurePainted() {
    (baseImg.decode ? baseImg.decode().catch(() => {}) : Promise.resolve()).then(repaintBase);
  }

  const markReady = () => { ensurePainted(); overlay.classList.add('intro'); setTimeout(() => overlay.classList.remove('intro'), 2600); };
  if (baseImg.complete) markReady(); else baseImg.addEventListener('load', markReady, { once: true });
  // the picked srcset candidate can change on resize/orientation change
  addEventListener('resize', ensurePainted, { passive: true });

  // default: open 日光舞台 (or deep-linked spot)
  const initKey = (location.hash.match(/spot=([a-z0-9-]+)/) || [])[1];
  openSpot((initKey && ALL[initKey]) ? initKey : 'sunrise');

  window.addEventListener('load', () => {
    if (window.liff) { const liffId = (document.documentElement.dataset.liffId || '').trim(); if (liffId) liff.init({ liffId }).catch(err => console.warn('LIFF init failed', err)); }
  });

  // ---------- Calibration mode (?cal=1) ----------
  if (new URLSearchParams(location.search).get('cal')) {
    const g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class', 'cal-grid');
    for (let x = 0; x <= VB.w; x += 100) { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('x1', x); l.setAttribute('y1', 0); l.setAttribute('x2', x); l.setAttribute('y2', VB.h); if (x % 500 === 0) { l.setAttribute('class', 'major'); const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', x + 4); t.setAttribute('y', 40); t.textContent = x; g.appendChild(t); } g.appendChild(l); }
    for (let y = 0; y <= VB.h; y += 100) { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('x1', 0); l.setAttribute('y1', y); l.setAttribute('x2', VB.w); l.setAttribute('y2', y); if (y % 500 === 0) { l.setAttribute('class', 'major'); const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', 4); t.setAttribute('y', y - 6); t.textContent = y; g.appendChild(t); } g.appendChild(l); }
    overlay.appendChild(g);
    let buf = [];
    overlay.addEventListener('click', e => { const r = overlay.getBoundingClientRect(); const x = Math.round((e.clientX - r.left) / r.width * VB.w); const y = Math.round((e.clientY - r.top) / r.height * VB.h); buf.push(`${x},${y}`); console.log('point:', x, y, '| poly:', '"' + buf.join(' ') + '"'); }, true);
    window.calReset = () => { buf = []; console.log('cal buffer reset'); };
    console.log('Calibration mode ON. Click to log coords.');
  }
})();
</script>
</body>
</html>
