    "s": [["S3-01", "德好將大數據股份有限公司", "德好將大數據股份有限公司是一家少數兼具AI大數據處理經驗跟企業運營策略顧問規劃的高雄在地企業，企業核心價值「成為企業數位轉型的最佳戰友！」，提供企業數位轉型過程中所需的預算、人力、工具等各項方案，擅長將代理的數位方案透過數據驅動整合出終端客戶適配之方案，讓客戶面對轉型挑戰中，可以大幅降低組織動盪與資源空耗。"], ["S3-02", "球球科技股份有限公司", "OrbanAI是一家專注於企業級 AI 落地服務的公司。很多企業想導入 AI，但卡在兩難：用公有雲怕洩密，自己買 GPU 伺服器又不划算且維運困難。\n\nOrbanAI 專門解決這個問題，不只提供在地化的前沿 ReAct 推理模型，更進一步實現從硬體算力到軟體架構的全面整合。透過我們自主開發的 Orban Engine，企業可以將 AI 能力無縫嵌入現有的工作流中，確保高品質、低延遲的體驗，同時讓資料完全留在企業內部的受信任環境。\n\n不需要支付高昂的硬體採購成本，就能享有比照私有雲等級的資料隱私。"], ["S3-03", "決心科技股份有限公司", "決心科技為製造業打造營運軟體。\n\n我們協助製造業改善接單、生產排程與產線管理流程，減少人工作業、降低交期延誤風險，讓管理者能更即時地掌握現場狀況。我們做的是貼近現場、真正用得起來的工具，而不是讓人多學一套系統。\n\n我們的產品對應製造現場的不同角色：\n• 業務與內勤 —— poassistant 訂單助理，免去人工登打各式客戶採購單。\n• 生管與現場 —— CommandRoom 工廠戰情室，整合排程、報工與機台聯網數據，掌握排程進度、生產狀況與設備稼動。\n• 生產與追溯 —— TraceMark 追碼，快速辨識加工件上的雷射雕刻序號，提升產品追溯效率。"], ["S3-04", "雲界數位創新股份有限公司", "雲界數位創新為國內雲端領導服務商伊雲谷投資的新創公司，團隊匯聚了來自工業自動化（OT）與資訊技術（IT）領域的多位專家，過往服務過 HP、Microsoft、ASUS、Moxa、TXone，在各自的領域擁有超過 20 年的豐富經驗。研發團隊精通嵌入式平台、Edge AI 與雲地協作系統開發，具備強大的技術實力。此外，亦熟悉全球市場行銷與產品推廣，過往造訪超過 40 多個國家。\n雲界數位創新股份有限公司，更被知名英國顧問機構 STL Partners 評選為全球 Top 50 值得關注的邊緣運算公司，同時獲選的企業包含思科系統（Cisco）、維諦技術（Vertiv）、西班牙電信（Telefónica）、AI 晶片新創公司 Groq、Red Hat 等。"], ["S3-05", "先晶方科技有限公司", "1. 半導體嵌入式人工智慧物聯網設計服務及供應鏈統包工程；2. 硬體+軟體數位轉型（DX）解決方案，例如數位醫療。"], ["S3-06", "可信智慧整合有限公司", "WesmartAI 是一間專注於「實體 AI 安全合規」的深科技新創公司。為了解決 AI 晶片的機率性本質與傳統工業安規（如 ISO 26262）絕對確定性要求之間的根本衝突WesmartAI 開發出市場上唯一的硬體級防線「SVG 物理海關」。該技術能以 37.037 奈秒的絕對常數級速度，在硬體實體層面攔截 AI 產生的幻覺或抖動異常指令，並直接切斷輸出，觸發底層安全控制器（Safety PLC）的停機保護機制。WesmartAI 致力於協助自動化設備商、機器人製造商與 AI 晶片廠，跨越 2026 歐盟 AI 法案（EU AI Act） 的嚴苛合規門檻，實現高風險 AI 系統「出廠即合規」的終極目標。"], ["S3-07", "神識物聯有限公司", "神識物聯是一家AIOT 公司，主要是以超高頻RFID 加上專利ＡＩ技術，提供超越Apple Air tag 的被動式公分級精準定位，免用電池，支持地球永續。榮獲新竹AIOT大賽獎項和Stevie Award 亞洲區創新產品銅牌，全台最佳成績。已有上櫃公司振躍精密與千人製造大廠邁特電子導入使用；並有來自香港Searching C 跨境電商和日本公司的合作邀約。"], ["S3-08", "全穎智聯有限公司", "全穎智聯 (SMANEX Co., Ltd) 致力於工業無線網通設備、邊緣運算閘道器、工業交換機的研發與製造，並提供整合性的物聯網雲端平台解決方案。我們致力於促進工業設備全面互聯 (M2M) 和各類工業物聯網 (IoT) 解決方案提供，以實現智慧化和數位轉型，服務涵蓋電力、能源、交通、環保、水利、油氣、製造等多元行業。透過創新的IoT解決方案，我們幫助客戶優化能源使用與生產效率、提升產業價值，並有效推動環境、社會和公司治理（ESG）的實踐，助力企業邁向永續發展的未來。\n我們的客戶包含以下二類：\n‧ 代理商與系統整合商：針對工業或大型戶外場域，提供硬體產品與自研的 SDRMS 管理平台授權，協助整合商大幅縮減複雜的網路設定與協定對接時間，讓他們能以 B2B2B 的模式快速滲透並服務終端市場。\n‧ 大型終端企業客戶：大型的製造業、市政工程與能源營運商。這些企業內部通常面臨設備通訊協議整合問題，以及高昂的跨國遠端維護成本。我們的軟硬整合方案能直接切入並解決這些高技術門檻的痛點。"], ["S3-09", "繁晶科技股份有限公司", "繁晶科技(Ranictek)是一間IC設計公司，主要研發的產品包含5G/6G基地台以及衛星通訊基頻(baseband)晶片，尤其針對開放式(O-RAN)基地台、通訊衛星、衛星地面站、無人機通訊之基頻晶片，並致力於提供客戶兼具節能與成本效益之晶片解決方案，期望能加速5G/6G基地台與衛星通訊之佈署與普及。"], ["S3-10", "勝豐精密有限公司", "勝豐精密有限公司成立於2022年,總部位於高雄,是專注於五金扣件與精密零件的 B2B 供應鏈整合平台。我們以「找得到・看得懂・買得到」為核心理念,整合超過 18,000 項 SKU,服務半導體、航太國防與精密機械等產業客戶,提供當日下單、隔日到貨的小批量快速供應。三大營業範疇為:五金扣件與精密零件供應、CNC 車銑加工件整合供應,以及國際五金零件協助採購。透過需求聚合與即時庫存供應,協助客戶解決規格查詢困難與小量採購的痛點。"]],
    "g": [["G3-01", "配客嘉股份有限公司", "配客嘉為環保科技社會企業，推出全台第一個「循環包裝」與「循環系統」，提供企業多元 ESG 永續解決方案。建置最完善的循環系統，攜手知名便利商店、連鎖通路、獨立店家合作，全台累積逾 4,700 個循環包裝歸還點，同時結合公益，透過包裝清潔為弱勢族群創造工作機會。迄今與超過 200 家企業品牌合作，客戶橫跨半導體、醫療、電商、實體零售、美妝、服飾、食品等多元產業，致力讓企業、客戶、消費者以便利形式落實 ESG，共同邁向永續未來。\n\n配客嘉近年於海內外頻展露頭角，2025 年 9 月獲經濟部中小企業署推薦前往 APEC Workshop 分享綠色物流與 ESG 產業實例。同年於 InnoEx2025 榮獲 InnoEx Global Startup Top 30 Award、於 Techsauce Global Summit 榮獲 2025 Techsauce Top 10 Awards，展現 MIT 綠色軟實力的國際競爭力。"], ["G3-02", "蕗植數位有限公司", "蕗植數位有限公司 (Luz Studio) 成立於 2024 年，旗下設立 ESG 部門與創意部門雙軌營運，致力於「綠色低碳」與「數位文化」的雙軸轉型。我們專注於生質能研發、碳管理策略、量測驗證與輔導節能，並融合獨立策展、IP 營運、企畫執行及自媒體營運等核心專長。蕗植（Luz）象徵著綠色深耕的生命力與價值的點亮，我們透過跨領域的策略佈局與資源整合，致力於為創作者、企業與品牌建立具備永續價值與市場影響力的商業座標。"], ["G3-03", "水力凈綠能科技股份有限公司", "散熱對於產業發展至關重要，在加上高雄天氣嚴熱，散熱的需求非常巨大。目前市場上都專注於散熱材料的開發，卻忽略了冷卻水塔這個環節。 水力凈服務結合IOT+水垢不生成技術+方法學，提供明確的散熱效率改善數據給企業。水力凈專注於冷卻水塔散熱效率改善，目前市場的專注所有的散熱材料的開發，卻忽料冷卻水塔散熱環節。所有的散熱材料最終都要透過冷卻水塔把熱帶走，水力凈在冷卻水塔現場架設IOT，收集散熱效率數據並導入解決方案_水垢不生成技術設備，在依據方法學設計的數據分析平台生成散熱效率改善及減碳報告書，提供業主明確具體的減碳減量數字，提升產業競爭力。 AI侍服器、算力中心、冷凍空調冷鏈、製程皆需要散熱，因此我們產品主要TA為： (1). 台灣上市櫃企業 ：只要有製程及空調設備，必定有散熱需求 (2). 有安裝冷卻水塔機組的單位，例如：飯店、醫院、購物中心、機場、捷運站、商辦大樓、食品廠"], ["G3-04", "天童國際開發有限公司", "天童國際開發有限公司從開發再生能源案場出發，隨著在ESG領域的持續深耕後在能源領域擴展了儲能以及EMIS的整合業務，並且在人類繞不開的照明議題上攜手效能領先業界31%以上的電老闆T8 Led及平板燈照亮世界，在生物多樣性領域也提供了國內外無螫蜂計畫，旨在透過復育、研究和教育，讓無螫蜂成為人與自然共生的象徵，協助企業量化生物多樣性成果，共同打造自然正向的永續報告與行動。"], ["G3-05", "和木相處有限公司", "以『木業加工廢棄物再利用』技術結合『友善家具』透過應用設計及木料加工處理技術使用原木邊角料再製技術打造價格較低卻較耐用的家具，較碎小的木料結合原民文化工藝應用設計及精油提取製成兼具功能性，富有溫度、有教育及原民文化推廣意義的產品，並以品牌化經營將原民特色推廣至國際。運用循環經濟理念提高木器傢俱製造廠所產生出的多餘木料角料加以回收再利用，並藉由木工工藝特色提升原民特有圖騰文化特色及工藝價值。減少讓餘、廢木料燃燒對環境空氣污染的二次傷害以及隨意棄置傾倒導致環境髒亂。因應CITES公約管控濒危木材的濒危木材範圍，減緩木料木材的砍伐，在環境永續上有所作為。"], ["G3-06", "海涯國際有限公司", "海涯國際成立於 2023 年 7 月，總部位於高雄，是一家專注於海洋技術開發與永續綠能服務的供應商。\n\n面對全球淨零碳排趨勢，我們致力於推動海事產業的「雙軸轉型」（數位化與淨零減碳）。業務核心涵蓋離岸風電綠能維運與遠洋漁業監測。我們自主研發的無人船 (USV) 系統，定位為新一代海事減碳基礎設施，旨在透過精準的自動化航行取代傳統高污染、高航行碳排的作業模式，協助綠能業者與海事客戶落實 ESG 減碳目標。\n\n在海涯，我們透過跨產業合作，將前瞻科技與綠能產業鏈深度融合，提升藍色經濟效率，為海洋環境的淨零永續提供具體可量化的貢獻。"], ["G3-07", "杉蔓有限公司", "杉蔓有限公司 (Sustainable Man) 致力於為企業打造全方位的永續淨零生態圈 。我們深知氣候變遷對土地的衝擊，因此拒絕僅提供冷冰冰的合規說明，而是透過專利節能硬體技術與創新永續教育，協助企業在最佳時機與組合下達成實質的減碳目標，建立共生共榮的永續生態圈 。 我們的核心理念源自於「杉」與「蔓」的結合：「杉」代表我們以精準與誠信，為企業在混亂的減碳規範中建立永恆基準；「蔓」則象徵強韌的連結，期許作為專業媒合平台，鏈結城市決策者與鄉村生產者，讓斷裂的價值鏈重新接合 。 為化解企業在追求淨零過程中的碳焦慮，杉蔓有限公司提供以下三大核心解決方案 ： 獨家專利：MS-RDK 空調智慧節能解決方案\n在完成溫室氣體盤查後，企業最常面臨的瓶頸即是「如何達成實質減碳」。針對企業營運中耗電量佔比極高的空調系統，杉蔓投入開發出獨家專利的 MS-RDK 空調節能系統 。此方案跳脫了傳統僅停留在報告書層面的減碳建議，透過精準的數據擷取與智慧化運算控制，直接對症下藥。MS-RDK 系統能大幅優化空調設備的運轉效率，將抽象的淨零碳排目標，直接轉化為電費單上清晰可見的實質降幅 。這套具備實戰能力的專利節能系統，不僅能有效降低企業營運成本，更為企業在面對未來的碳費徵收與國際供應鏈減碳要求時，提供最紮實且強而有力的硬體技術底氣 。 首創 ESG 策略桌遊與多元培訓\n為了將 ESG 概念真正深植企業文化與全民心中，杉蔓首創兼具趣味性與教育性的「ESG 策略桌遊培訓」 。我們將複雜的永續政策與規範，轉化為掌中的模擬決策遊戲，讓不同年齡層、不同專業背景的高階經理人與基層員工，都能在互動中輕鬆學習 ESG 知識，並真正理解永續對個人與企業的意義，有效凝聚組織內部的減碳共識 。 國際標準認證輔導\n提供 ISO 14064 碳盤查與 ISO 14067 碳足跡等專業輔導，協助企業建立精準的碳管理基線，產出符合國際標準的清冊與報告書，強化綠色供應鏈競爭力 。 杉蔓有限公司除了專業的永續輔導業務外，更將「與土地共好」視為不變的初衷 。我們承諾將年度盈餘的 15% 投入社會使命，從台灣在地農村出發，提供農友實質的幫助，並協助企業落實企業社會責任 。 資源挹注農村轉型： 將資金投入協助傳統農村轉型與偏鄉永續教育，讓農友的永續產品能順利進入市場 。 培育 500 名具備 ESG 知識的永續人才： 設立明確的 500+ 人才培育目標（永續種子），積極培育下一代，表達企業對未來永續發展的重視與決心 。 共同邁向全民 ESG 時代： 杉蔓期望帶領大眾迎向 ESG 的新時代，致力做一個對地球有責任感、對下一代有溫度的永續人 。"], ["G3-08", "桾澤國際有限公司", "GEI（Ginzer Evergreen International）以「Sustainable • Creative • Technology」為核心理念，致力於整合永續策略、能源應用、創意設計、文化內容與國際合作資源，打造跨領域的永續創新平台。\n\n我們相信，永續不只是技術升級，更是一種連結人、環境與未來生活的思維。GEI以策略整合與顧問服務為核心，串聯能源、ESG、品牌、文化與國際市場資源，協助企業建立兼具創新性、永續性與市場價值的發展模式。\n\n透過跨域合作，GEI積極推動綠能應用、永續發展、創意內容、藝文交流與國際商務合作，探索能源科技與生活美學之間的更多可能。\n\n未來，GEI將持續朝向永續顧問、國際能源合作、文化創意、數位內容及未來生活提案等領域發展，成為連結科技、創意與永續價值的國際平台。\n\n讓科技更有意義，讓創意產生影響，讓永續成就未來。"], ["G3-09", "亞耕酒業股份有限公司", "亞耕酒業（IRON BRIDGE Distillery）扎根於南台灣的高雄大樹，是一座將在地風土與國際頂尖釀造工藝完美融合的職人精釀酒廠。我們秉持著「從產地到酒杯」的永續理念，深耕在地農業，將南台灣豐富的農產與大樹優質水源，轉化為具備國際競爭力的精釀烈酒。亞耕酒業不僅專注於風味的極致追求，更積極導入綠色生產，透過低碳製程與資源循環，實踐對這片土地的環境承諾。\n\n作為酒廠的靈魂之作，「水牛威士忌」（Bubalus Whisky）體現了台灣傳統堅韌的「水牛精神」與現代創新美學。我們嚴選高品質原料，並在釀造過程中注入獨特匠心。為展現絕無僅有的在地風味，水牛威士忌大膽運用台灣特有的地方果木進行桶陳熟成，讓醇厚的酒體在海島氣候的催化下，激盪出層次豐富的東方成熟果香與溫潤木質調。不論是醇厚迷人的香氣，還是絲滑細緻的口感，水牛威士忌都完美詮釋了台灣高端威士忌的全新美學，是獻給品味者的極致饗宴。"], ["G3-10", "碳行者科技股份有限公司", "碳行者科技以「智能碳管理」與「低門檻 ESG 行動」為核心，協助企業將員工日常行為轉化為可追蹤、可量化、可累積的永續成果。透過「碳積點生活 App」，企業可推動員工參與低碳日常與永續行為，行為範圍涵蓋環保、健康與公益三大面向，並結合多元紀錄模組與遊戲化機制，例如任務設計、點數獎勵、排行榜、挑戰活動與遊戲化情境，引導員工持續參與。企業也能將原有的員工福利、內部獎勵或合作商品，轉化為點數兌換誘因，讓原本只是單向發放的福利資源，進一步與員工永續行動、參與數據及成果紀錄連結，成為後續永續報告書、ESG 成果揭露與對外溝通可運用的素材。\n\n在產品服務上，碳積點生活 App 其中一項核心模組為交通紀錄，可自動偵測使用者的交通方式，免綁定特定運具，即可記錄每日交通碳排與低碳移動成果。除此之外，碳行者科技也同步推出企業碳數據與移動應用服務，其中「差旅碳報告系統」可協助企業運用既有差旅報帳或交通單據資料，快速轉換為碳排數據，降低企業在範疇三交通與差旅資料整理上的行政成本，並提供後續 ESG 揭露、內部管理與成果分析所需的量化基礎。\n\n對企業而言，碳行者科技提供的不只是活動平台，而是一套能協助企業推動員工參與、量化日常行動、累積永續成果的數位化工具。透過實際導入經驗，平台已協助企業提升員工參與率 35% 以上，並讓企業能依照自身需求導入不同的行為模組與遊戲化機制。碳行者科技希望讓 ESG 不再只是報告書中的揭露項目，而是能從員工日常行動出發，逐步被記錄、被管理、被量化，並轉化為企業可持續呈現的實際成果。"], ["G3-11", "灃柇永續有限公司", "灃柇永續有限公司以「循環農業」與「社會影響力」為核心，致力於將農業剩餘資材轉化為具市場價值的永續產品與服務。我們從蚯蚓生物性處理、微生物應用、有機質肥料開發切入，協助農業廢棄物減量、土壤健康改善與低碳農業轉型，打造從資源循環、農業生產到品牌加值的整合型解決方案。\n\n旗下品牌「拾蚯樂」聚焦蚯蚓肥料與永續教育，推動家庭、校園、社區與農業場域理解廚餘及農業廢棄物再生的價值；同時結合嘉義牛斗山蓮藕產業，發展產銷履歷農產品、加工品與食農教育，讓循環農業不只停留在環保理念，而是成為地方產業升級與農村創生的實踐模式。\n\n灃柇永續期望透過技術導入、品牌經營與跨域合作，建立可複製、可擴散、可量化影響力的農業循環系統，讓每一份廢棄資源，都能重新回到土地與市場，創造環境、經濟與社會三重價值。"]],
    "m": [["M1-01", "正美集團", ""], ["M1-02", "ACCUPASS 活動通", "ACCUPASS 是專為活動主辦方打造的智慧型一站式活動平台，提供線上報名、電子票券、金流整合、行銷推播、社群宣傳、現場驗票與數據分析等全方位功能，協助主辦方輕鬆籌辦各類活動——從講座論壇、展覽市集、企業內訓到大型演唱會，皆可一站搞定。\n\n自成立以來，ACCUPASS 已累積超過 450 萬會員，每月網站瀏覽量突破 7,000 萬，深受活動主辦方與參加者信賴與喜愛。\n\n我們持續以創新科技與貼心服務，讓辦活動變得更簡單，參加活動更有感，為活動市場注入更多想像與無限可能！"], ["M2-01", "阿物科技股份有限公司", "阿物科技是以 AI 驅動的台灣 SEO 及 MarTech 服務領航者，因應市場趨勢需求，結合百億跨產業關鍵字資料庫與 AI 技術，自動萃取商品標籤，首創以商品數據為中心的全通路 AI 行銷科技解決方案，涵蓋流量獲取、轉換優化、再行銷、會員留存與數據加值等應用，協助零售與電商打造無縫接軌的超個人化用戶體驗。"], ["M3-01", "豐盛盤", "All Good Creative 是一家專注於海外市場的影音與視覺內容出口製作公司。\n\n團隊深諳跨國專案的協作模式，專門為「海外國際品牌」以及「佈局全球的台灣外銷企業」打造符合國際高標準與美學的數位內容。有別於傳統的單次發包，All Good 透過彈性的訂閱制提供持續性的專業服務，以模組化全線上管理，無縫接軌成為企業專屬的外掛創意部門。\n\n線上遠端與海外實地拍攝的足跡已涵蓋韓國、泰國、日本、美國、越南、澳洲、中東與上海。從全外語品牌企劃、翻譯、影音製作到視覺設計，All Good Creative 的核心目標是讓產出的品牌故事在國際舞台上始終精準，且真正符合海外市場與消費者的真實口味。"], ["M3-02", "果源創生", "果源創生是一家從地方創生出發，逐步轉型為協助傳統企業數位轉型與品牌升級的 AI 行銷顧問公司。\n\n我們以「整合行銷 × AI 導入 × 地方商業場景」為核心，協助傳統產業、中小企業、地方品牌與通路型業者，進行品牌定位、內容行銷、社群經營、廣告投放、AI 工具導入與行銷流程優化。\n\n目前果源創生已服務約 30 間中小企業，輔導其進行數位轉型與行銷升級，並獲得經濟部 115 年度「小微企業區域數位加值與創新體驗計畫」支持。團隊也與高雄翰品酒店建立長期合作關係，持續推動地方品牌、旅宿場景與創新行銷的整合應用。\n\n除了顧問與代操服務外，果源創生也正在開發閉源式 AI SaaS 產品，聚焦於企業資安檢測、公關風險檢測與品牌聲量監測，協助企業在 AI 時代更有效率地管理品牌風險與市場溝通。\n\n同時，我們也針對地方行銷開發 AI 遊程 APP，透過遊戲化任務、互動導覽與商家串聯，讓地方文化與商家品牌能以更有趣、更有效的方式被旅客理解與消費。\n\n果源創生希望成為傳統企業進入 AI 行銷時代的轉型夥伴，協助企業把既有資源轉化為更具競爭力的品牌資產與商業成長動能。"], ["M3-03", "潮嶼工事所", "讓讀寫美學著陸的實踐者，以廣告文案與內容串連實踐美學與品味、生活風格與質感設計、沈浸式體驗與地方創生。引進生成式技術結合創作者核心技能，期能達到讓文學發揮商業價值的最終目標。"], ["M3-04", "洽洽貓文創", "洽洽貓事務所｜People x Play x Place\n讓頂尖人才，盡情玩樂，創造與眾不同之地！\n\n成立於 2020 年的洽洽貓事務所，以Chat（對談）、Communication（交流）、Culture（文化）為服務核心，致力於應用創新思維架構與技術，透過品牌重構，為企業與所在地注入創新能量。\n\n我們不只做設計，更利用數位行銷的數據思路，結合專業顧問評估，為您的品牌每一步投入預先評估風險，追求更有效的資源配置與行動。\n\n用設計帶動商業，重點不在美，在於打造「有策略的美」。\n\n團隊成員出自廣告公關背景，具備堅實商業操作經驗，服務過百大企業、公部門與國際藥廠。我們將長年對商業市場熟悉度，投入到地方與新創品牌領域，透過不斷與頂尖藝術家團隊共創，持續為品牌注入融入充滿生命力的地域魅力。\n\n精準的社群數據與輿情分析，協助業主洞察消費者行為背後的核心動機，在瞬息萬變的數位時代中，用最即時精確的市場觀點，幫助企業站穩腳步、逐步轉型。\n\n除了品牌策劃與行銷活動之外，近年我們持續將服務延伸至地方生活節、旅宿品牌轉型與周邊遊程服務開發、藝術餐飲品牌設計，透過「找故事、做體驗、推品牌」全方位優勢，解決品牌與行銷之間的執行落差，通過一致性服務，提升整體品質。\n\n活化場域，與藝術和科技鏈結文化，打造充滿魅力的感官地標，將在地文化轉化為具備市場亮點的獨特 IP，解決區域產業老化的問題，是我們為熱愛的土地想持續努力的事。"], ["M3-05", "鼎新創", "鼎新創股份有限公司是一家成立於2021年，致力於研發XR互動技術的公司。\n\nAI 數據洞察優化「體驗式行銷」： 我們不僅提供 AR/MR 的虛擬試穿戴或 3D 產品互動，更導入 AI 演算法分析用戶的互動行為與視線偏好。這能協助中小企業主精準掌握消費者意圖，實現個性化的行銷推播，進而大幅提升電商或實體通路的轉化率。\n\nAI 賦能的低成本「跨境精準行銷」： 針對缺乏海外資源的中小企業，我們透過 AI 自動化技術（AIGC）快速生成 AR/MR 數位孿生內容，結合 AI 多國語言虛擬導覽員，讓跨境買家無需出國，即可在虛擬空間中體驗產品細節。這不僅突破地域限制，更幫企業省下巨額的跨境實體參展與營運成本。\n\nAI 導向的「品牌數位轉型」： 我們協助傳統品牌進行科技重塑（例如：AI 互動式 AR 包裝、MR 智能品牌故事體驗）。透過 AI 的自動優化與數據回饋，傳統企業能以最低的技術門檻，快速建立「科技、創新、懂年輕人」的現代品牌形象，成功達成數位轉型。"], ["M3-06", "可以文創展演", "可以文創展演有限公司（We Can Arts & Culture Co., Ltd.）秉持「可以！不只是回答，是我們的態度」的品牌精神，專注於展會活動整合、專案管理及創意執行服務。\n團隊長期深耕政府專案、產業展會及大型活動領域，服務內容涵蓋展場空間規劃、展覽裝潢工程、燈光音響整合、大圖輸出製作、活動企劃執行及品牌行銷推廣等，提供從前期規劃到現場執行的一站式整合服務。\n近年累積執行多項中央及地方政府大型專案、創業輔導計畫、產業展覽及城市行銷活動，服務規模日益龐大。\n團隊以專業專案管理能力串聯設計、工程與行銷資源，協助客戶有效整合跨領域需求，打造兼具品質、效率與創新價值的展會體驗。\n未來將持續結合數位科技、AI應用與創新展演模式，成為南台灣最具整合力與執行力的展會服務夥伴。"], ["M3-07", "澄果國際", "『 打造千人千店連鎖獲利店 』是 Fixs Spark 持續深耕維修產業的核心理念。 透過創新思維與技術的投入，我們提供更便利的接單管理工具與專業顧問服務， 讓維修商家更易於營運、提升服務品質，進而優化消費者的維修體驗，成功拉近顧客與技師之間的信任距離。"], ["M3-08", "伊雷恩創意科技", "─── 公司歷程 ───\n伊雷恩創意科技成立於 2025 年，專注於結合視覺設計、前沿技術與創新思維的數位轉型顧問團隊。\n我們深信，數位轉型不應該只是冰冷的系統升級，而是讓品牌靈魂與科技產生完美的共鳴，將細膩的品牌美學融入數位產品中，協助補教業、留學代辦、美業及各類品牌，在數位浪潮中找到專屬風格。\n目前已累積 30 多項專案經驗，我們深耕於品牌美學、網頁與系統開發，致力於以工程化的思維解決營運痛點，並積極導入 AI 與創新工具。\n\n─── 核心服務 ───\n提供從「品牌定位」到「技術落地」的一站式解決方案，協助客戶品牌在數位時代持續領先：\n\n✦數位轉型顧問：深度了解業務需求，規劃兼具營運效率與品牌溫度的轉型策略。\n✦品牌美學設計：從 Logo、插畫到 UI/UX，以精緻美學強化品牌辨識度與質感。\n✦網頁軟體開發：專精客製化開發與網站規劃，提供穩定、安全且流暢的操作體驗。\n✦AI 導入與智慧應用：運用前沿 AI 技術整合自動化流程，讓數據驅動您的事業成長。"], ["M3-09", "七分之二的探索", "七分之二的探索為內容成長與 AI 工作流導入顧問團隊，長期透過 SEO、內容策略與數位工具協助企業提升品牌曝光、獲客效率與營運成效。\n\n團隊自營內容平台多年，累積超過 5,797 萬次搜尋曝光與 356 萬次網站點擊，並與數百家品牌及體驗業者合作。近年因應 Google AIO 與 AI 搜尋興起，進一步發展 AI SEO 顧問服務，協助企業提升於搜尋引擎與 AI 平台中的曝光與收錄機會。部分客戶於合作 6 個月後，廣告點擊成本（CPC）下降 62% 至 72.2%，有效提升流量取得效率。\n\n除數位行銷服務外，團隊亦將 AI 技術實際導入營運流程，陸續建置 GA 數據自動推播機器人、品牌曝光監測工具、一鍵上稿系統及行政文件自動生成工具等應用，將 AI 落實於內容生產、數據分析、專案管理與行政作業。\n\n基於自身實戰經驗，七分之二進一步發展 AI 工作流導入顧問服務，協助企業盤點流程、建立知識庫、導入 AI Agent 與自動化機制，提升組織效率並加速數位轉型落地。"], ["M3-10", "沃客互動", "沃客互動（Varket）是一個以 AI 與 Web 技術為核心的互動內容創作平台，致力於讓任何人都能快速建立故事遊戲、3D 虛擬空間、教育內容、品牌互動體驗與 AI 應用。\n\n透過自主研發的網頁互動引擎與 AI 工作流程，使用者無需安裝軟體，即可在瀏覽器中完成內容生成、編輯、發布與分享。平台支援 WebVR、WebAR、即時互動、IoT 裝置串接與 AI Agent 整合，已應用於教育科技、文化科技、品牌活動及互動展覽等領域。\n\n我們相信未來的內容創作將由 AI 與創作者共同完成，而 Varket 正在打造連接創作、互動與發佈的新一代內容基礎設施。"], ["M3-11", "陣列效應", "秉持「Smart way to create / Less effort. More effect.」的研發理念，我們專注於打造高效、資產化的影音生產系統：\n\nAI製程：於華碩雲市集上架「批量AI影音解方」\n\n資產管理：自主研發「影音GEO 、影音知識庫」等AI -drive 影音延伸服務\n\n製程設計：影音專案管理、模擬片場系統等\n\n憑藉創新的「影視 × 科技」服務，陣列效應榮獲「2025年數位X淨零轉型應用服務」遴選入選。我們將持續以技術驅動，協助企業更省力、高效地展開規模化影音佈局。"]],
    "h": [["H2-01", "台喬醫藥", "台喬醫藥股份有限公司致力於推動醫療數位轉型與智慧照護，是一家深度結合前瞻 AIoT 科技與醫療數據標準化技術的創新企業。\n\n我們專精於 HL7 FHIR 中介軟體 (Middleware) 架構整合，協助醫療機構打破資訊孤島，實現高效的數據互操作性。同時，我們導入先進的非接觸式毫米波雷達 (mmWave radar) 技術，提供無隱私疑慮的精準生理監測（如呼吸、心跳）與跌倒偵測，廣泛應用於智慧病房與高齡居家照護。\n\n台喬醫藥深耕在地，服務版圖涵蓋台中、台南、高雄文山、嘉義至花東地區，並於高雄及台中設立遠距照護示範中心。"], ["H3-01", "地球星", "地球星有限公司旗下的「地球星 AI 學苑」，是一所以專題式學習（PBL）與設計思考為核心、深耕全年齡層的專業 AI 學苑，透過耐心帶領及溫暖陪伴，希望能讓每位到來的人都在 AI 時代找到發光的舞台，實踐科技賦能。\n\n地球星的足跡遍及各個領域：\n全齡 AI 實踐： 從樂齡、一般民眾、青少年到學齡兒童，我們提供趣味、激發創意、實際動手操作的各項課程。\n\n公部門協作： 攜手文化局、社會局等單位，開辦多元AI 培訓課程，輔助大家對 AI 工具的熟悉度與實務應用場景熟悉，進而提升工作效率。\n\n企業內訓： 協助企業客製化AI 課程與講授，減輕員工行政負擔、提高生產力、鼓勵創新。\n\n在這段深耕全齡教育的旅程中，樂齡族群也是我們相當獨特的一個領域；地球星是全台首間為樂齡朋友打造 AI 創作課程的機構，我們致力於打破數位鴻溝，讓長輩成為能駕馭科技的創作者，延續每一個精彩的人生故事。\n\n從樂齡、企業到政府單位，地球星不只是傳授 AI 工具的場域，更是陪伴每位學員透過 AI 探索世界、實踐自我的溫暖夥伴。地球星期許能成為‘’最有愛的 AI 學習遊樂園‘’"], ["H3-02", "智感先鋒科技", "智感先鋒科技專注於高齡安全科技，結合 AI、物聯網與智慧穿戴技術，打造全球少見的「先制防跌」解決方案，推動照護模式從跌倒後救援走向跌倒前預防。"], ["H3-03", "科學毛怪生物資訊科技", "長照機構與家屬常有嚴重資訊落差，照服員需手動記錄大量生理數據。本系統「長照小生物」建置在大家最熟悉 LINE 帳號上，打造零門檻智慧長照樞紐。透過「AI 醫療影像辨識」照服員只要拍下血壓計螢幕，以 OCR 技術精準抓取數據。亦開發「智慧去重覆蓋 (Upsert)」技術。無論 LINE 還是機構端表單輸入，皆自動辨識並更新同一天數據。此外， AI 自動解答長照問題，結合 AI 精準資料庫整合，成為長照機構、家屬與個案最好幫手。"], ["H3-04", "吉格線", "AI-KM 無幻覺知識管理系統，搭載吉格線自研核心模組 LDPAE（含 SAS 語意分析、RRD 區域限縮資料庫、LAS 邏輯分析三大子系統），透過「限縮資料庫＋邏輯推導」策略，實現「限定回答、無幻覺、可控制」的企業級 AI 問答能力。系統支援 4 週資料更新機制、讚／不讚回饋優化、Hybrid RAG 架構與 System Prompt 動態調整，並具備 FAQ 快速導入、AI 與真人客服切換能力。於永豐銀行金融科技大展中經 922 位使用者實測達成回應內容完全正確。針對醫療健康與高齡照護場域，可應用於用藥衛教查詢、慢性病管理問答、長照資源指引、醫院 FAQ 客服等對「答案準確性」要求極高的應用情境，避免一般生成式 AI 幻覺風險。\n\n吉格線提供 Avatar 與 AI-KM 整合解決方案 WSSS（Web 虛擬人無幻覺 AI-KM 系統），可串接 AI-Voice Engine（國台英三語）與 MR Smart Glasses，形成完整的「醫療互動 × 高齡照護」技術堆疊。團隊 COO 方敬霖具藥師背景與智慧醫療顧問經驗，可協助場域導入規劃。"], ["H3-05", "醫識通", "Diagmind 是由臨床醫師與工程團隊共同打造的 AI 醫學教育平台，專注於醫學生、實習醫師、PGY 與年輕醫師的臨床推理訓練。平台結合結構化醫學內容、AI 模擬病人、OSCE 練習與個人化學習追蹤，並由 30+ 位臨床醫師參與內容整理與把關，協助學習者從記憶知識進一步建立面對真實臨床情境所需的判斷能力。\n\n除了學生端學習平台，Diagmind 也發展醫院與醫學院端的 AI 教學解決方案，協助臨床教師將教案、臨床經驗與推理流程系統化保存，轉化為可重複使用、可持續優化的教學資產，打造更永續的醫學教育生態。"], ["H3-06", "艾達特整合分析", "「艾達特」取自定序中的 adaptor（轉接子），象徵我們在生物與資訊之間扮演承接與轉化的角色，連結前端樣品建庫與後端數據分析。我們專注打造客戶導向的基因體整合服務，從建庫到分析提供一站式支援，並依研究或應用需求量身設計流程，跳脫一體適用的業界模式。團隊具備生資、生醫、演化等多元背景，累積處理超過四千個樣品、涵蓋六十多樣物種，具豐富國內、海外專案實績。我們相信，唯有理解需求，才能創造真正有價值的基因體服務。\n\n2025年亞灣新創大南方，艾達特延續深耕已久的基因體服務支援，以自身的基因體專業背景、豐富的生物資訊處理服務，推出更加符合業界應用面相的eDNA檢測服務與preciRAD分子育種檢測服務，讓前沿科技走入產業，以基因體技術提供更便捷的解方。"], ["H3-07", "知千里", "知千里科技有限公司是一家專注於人工智慧（AI）與物聯網（AIoT）軟硬體整合的科技新創團隊。我們秉持「以科技賦能，讓社會與教育更有溫度」的理念，憑藉深厚的學研底蘊與系統開發實力，致力於將先進的數據分析技術轉化為直覺、實用的數位解決方案。面對高齡化社會的照護挑戰，我們將過去在「教育科技（EdTech）」累積的互動設計經驗，延伸至「智慧醫療照護」領域。藉由過去累積的經驗，發展具備處理複雜邏輯判斷與高品質軟體工程的根柢 。希望能為長照機構提供兼具科技深度與人文關懷的創新解方，精準契合長者在認知復能與靈性支持上的迫切需求 。"], ["H3-08", "拿趣科技", "拿趣科技（TechItTech）致力於開發結合人工智慧（AI）、物聯網（IoT）與邊緣運算（Edge AI）的智慧生活解決方案，專注於解決物品管理、記憶輔助與高齡照護等生活痛點。\n\n目前核心產品為「AI智慧尋物系統」，透過智慧貼片、低功耗藍牙（BLE）、語音互動及雲端管理平台，協助使用者快速找到遺失物品，降低尋物時間與生活負擔。系統可應用於居家照護、高齡族群、醫療照護及智慧空間管理等場域。\n\n未來將持續結合生成式AI、智慧代理人（AI Agent）與邊緣AI技術，打造更直覺、更智慧的人機互動體驗，讓科技真正融入日常生活。"], ["H3-09", "島域日和工作室", "島域日和工作室創立於2025年，核心理念是「有溫度的日常陪伴」，結合手作與身心靈療癒能量。在忙碌與高壓的生活中，每個人都需要一個讓自己慢下來的地方——我們以水晶牌卡、香氛、手作創作與五感體驗為媒介，打造一個能安心停留的療癒空間與手工藝課程，陪伴每一位參與者放慢腳步、整理思緒，重新與自己連結。透過牌卡的引導、創作的專注與香氣的陪伴，讓情緒有出口，讓壓力有機會被釋放，也讓每個人在創作中重新感受內在的力量。\n服務內容\n\n客製化水晶樹製作：主打「尊榮包場體驗」，一場次僅接待一組顧客，提供親子或伴侶專屬談心空間，並能親自挑選能量水晶編織成獨一無二的生命之樹。\n水晶牌卡與手作療癒課程：以水晶牌卡結合香氛、擴香石、水晶編織等手作媒介，設計團體療癒紓壓課程，適用於機關企業員工協助方案（EAPs）、社福據點及各類團體活動。\n社福、身心照護、高齡族群客製化課程：我們為社福、身心照護、高齡族群設計相關卡牌製作，透過牌卡引導與手作陪伴，協助參與者放鬆身心、找回內在力量。\n手作斷捨離與交流市集：不定期舉辦工作室市集與出清活動，以「緣分價」分享各類創意模具、手作零件及工具，歡迎喜愛編織、手工藝的創作者到空間交流創作心得與經驗。"], ["H3-10", "ScoliScan", "本團隊由陽明交通大學醫學工程學系、臺北榮民總醫院骨科部以及國立臺灣大學土木工程學系跨領域組成，融合醫學工程、資訊工程與臨床醫學專業，致力於開發「無輻射脊椎側彎智慧篩檢與追蹤系統」。本系統整合即時 AI 分析技術，具備安全無輻射、高效能與即時回饋之優勢。"], ["H3-11", "冷杉科技", "Snatch 是台灣首個微型即時健身平台，主打 15 分鐘真人教練視訊課程，每堂 300 元台幣，無合約、隨時預約。\n\n有別於傳統健身房高月費與長期綁約，Snatch 將運動門檻降到最低——用戶不需要購買器材、不需要通勤、不需要承諾，只需要 15 分鐘。每堂課前，平台 AI 自動生成個人化訓練簡報，讓教練即時掌握用戶狀況，提供真正有效的客製化指導。\n\n目前已與醫療院所合作，透過醫師推薦將有運動需求的患者導入平台，開拓差異化的獲客通路，打造運動科技與預防醫療的交叉地帶。"], ["H3-12", "淞康國際", "淞康國際股份有限公司創立以來，持續專注於醫療照護與居家/外出 護具彈繃，應用領域的醫材創新發展，結合醫材級設計思維與臨床實務經驗，推出一系列具高度實用性與差異化的產品。\n公司核心團隊來自醫療與生技背景，秉持「讓護理更簡單，讓照護更安心」，積極開發具獨家專利技術、貼近使用者需求的醫材產品。\n\n產品主力：\nKORATÉ 扣繞貼護具彈繃 系列產品整合「彈性包紮」、「快速黏貼」、「護具支撐」三大功能。\n「扣拉貼」止血繃帶適用於急救處置。\n淞康微電流敷膜妝品導入器可適於術後照護、運動防護與日常照護，並已成功導入國內外通路市場。\n\n產品/服務"], ["H3-13", "遠視界科技", "遠視界專注於護眼產品的研發與製造，專注於高頻用眼族群的日常觀看體驗，以專利光學設計出發，提供在閱讀、學習與螢幕使用時，改變觀看距離與姿態的另一種選擇。"], ["H3-14", "婕斯國際", "婕斯國際（J-Smile）專注於研發居家美學護理產品，TTI美牙膠源自於工業技術研究院團隊，結合尖端生技背景與創新技術。我們擁有穩定的產品生產標準與通路開發經驗，全台服務據點已突破 300 家，成功驗證產品的市場競爭力。我們目前積極推動國際化佈局，致力於將台灣研發的高端居家美學產品與加盟模式輸出至海外市場。歡迎國際通路商、代理商洽詢合作，攜手開拓全球智慧居家美容版圖。"]],
    "e": [["E1-01", "梭易科海洋應用方案", "AI Sailor, 航行輔助駕駛系統 :整合日光及紅外線攝影機、雷達、船舶自動識別系統(AIS)及水下聲納等感測器訊號，經由AI辨識及資料融合技術獲得感知障礙物相關資訊，提供給自行開發之船舶避碰演算法進行演算，並給予使用者避碰警示/警告及避碰建議。並可將避碰航向訊號提供給船上之自動導航系統執行，讓船安全迴避。"], ["E2-01", "嵙思科技", "嵙思科技專為生醫製藥公司建構大數據及 AI 平台。我們銷售實驗室資訊管理平台 Pharmquer及人工智慧 QA 助手 Oryza.ai"], ["E2-02", "樂堤科技", "樂堤科技 FUNTEK 是一家致力於研發即時通訊開發套件 SDK 的軟體開發公司，除了自研產品，也提供高品質的手機 App 與網路應用程式的開發服務，擁有豐富的開發經驗和專業的團隊，能夠滿足客戶各種需求，從概念到實現，為客戶打造出色的解決方案。\n\n除了軟體開發服務外，樂堤科技還提供產品經理的顧問服務，幫助客戶在產品開發過程中進行規劃和管理，確保產品的成功上市和持續發展。\n\n此外，樂堤科技擁有自己的產品線，包括：\n\nIMKIT：一個即時通訊 SDK 與 API，讓客戶能夠輕鬆在手機應用程式或網站應用中，快速整合即時通訊功能，提升用戶即時互動體驗。\n\nPinChat：一個商務即時聊天 Live Chat 服務 ，提供安全可靠的通訊平台，幫助中小型或個人商家實現客戶聯繫互動。\n\nTripTime：一個結合行程共編和即時通訊功能的旅遊規劃工具，讓用戶能夠輕鬆地計劃和分享旅行計畫。"], ["E2-03", "詹姆斯科技顧問", "JTCG成立於2018年，提供頂級的SaaS 導入諮詢服務和客製化開發支援。\n在2023年，我們推出了 RACCOON AI ，一款全面性的智能客戶服務解決方案，幫助台灣企業應對市場變化。\n作為 Zendesk 的官方深度合作夥伴，並擁有超過5年的資深用戶經驗，我們在引導您使用Zendesk解決痛點方面擁有獨特的優勢。\n我們成功協助各種企業的多樣化整合需求，建立了更順暢和高效的客戶溝通體驗。"], ["E3-01", "根基智能理財", "【根基智能理財科技】專注於現代家庭財務管理挑戰，透過智能個人財務管理系統，結合財務資訊收集、分析與報告，提供量身訂製的建議，助家庭實現財務自由與成功。"], ["E3-02", "資通行動", "資通行動科技有限公司以企業ERP與CRM軟體為主要服務標的，其中一項開發服務『GLAD』是一套結合行動通訊、衛星定位、大數據、雲端運算以及聊天機器人等關鍵技術全新開發的的智慧雲端交通運輸服務平台。『GLAD』整合電話、APP、LINE CHATBOT、企業搭車數位電子流程簽核、長照車電子簽核、行動支付等各項服務，協助商業車隊打造全新的營業模式，適合計程車、租賃車、運輸接駁、長照、物流等業者使用。"], ["E3-03", "創未來智慧生活", "創未來（Inno Future）致力於打造亞洲數位房地產的終極作業系統。作為台灣首個結合 AI、FinTech 與 IoT 智聯網的全方位 PropTech 平台，我們為包租代管業者及大型建商提供企業級的降本增效解決方案。\n\n旗下核心產品「好未來 SaaS 系統」打破了傳統軟體的侷限，成功將自動化金流分帳，與無須改變管線的自行研發「無線智慧電錶」及「雲端門鎖」深度整合。為了將管理效能最大化，我們推出了專屬的「好未來 APP」，賦予管理者與使用者前所未有的行動體驗：\n\n總裁級行動戰情室：管理者可透過 APP 隨時掌控跨國物件的出租率、財務營收與空置預警，以數據驅動營運決策。\n\n租客一站式無接觸服務：租客只需透過手機，即可完成線上秒速繳租，並即時查看當前 ESG 智慧電錶的用電度數，實現徹底的資訊透明與節能減碳。\n\n權限與金流自動綁定：系統判定繳租完成後，APP 將自動派發或展延門禁密碼；遇異常欠租則自動暫停權限，以科技完美防堵呆帳風險。\n\nAI 智能報修與動態授權：針對帶看或修繕需求，管理者可透過 APP 一鍵發送「限時動態密碼」給仲介或維修技師，實現 100% 遠端零接觸管理。\n\n我們協助客戶從根本解決人工派工、對帳與能源盤查的痛點，在不增加人力的前提下，輕鬆實現千戶資產的跨國雲端管理。\n不受困於過去的傳統框架，我們用創新科技積極創造。\n\n創未來・好未來・\n創造未來為你而來。"], ["E3-04", "火花行動有限公司", "火花行動有限公司是一家專注於 AI 應用與軟體開發的新創公司，致力於透過創新技術解決產業痛點，提供數位轉型與自主產品開發服務，打造兼具實用性與創新性的數位解決方案。"], ["E3-05", "友睿資訊", "Yourator 是台灣領先的數位人才招募平台，專注於連結科技、新創、數位行銷等領域的優質人才與企業。平台目前擁有 60 萬以上月活躍用戶、每月 150 萬以上瀏覽數，累計服務超過 4,500 間企業，橫跨金控、半導體、FMCG、新創等多元產業，是外商跨國企業與科技新創招募人才的首選平台。\n除職缺刊登外，Yourator 亦提供雇主品牌推廣（Podcast 專訪、SEO 文章、短影音）、AI 招募助理系統 Teamdoor，以及每年舉辦職涯博覽會，2026 年博覽會吸引逾 15,000 名求職者參與。"], ["E3-06", "人才宇宙諮詢", "TALENTVERSE 為專業的人資策略諮詢顧問，以先進 AI 技術洞察人才特質，\n為亞太地區各企業提供獵才招募、人才測評、教育培訓與組織發展服務。讓企業先預知人才未來，再決定選育用留。\n\nTalentVerse AI人才績效預測系統\n代理自美國企業界、心理學界、AI界的最新技術，基於人格特質的完整分析，整合超過 450 項當代心理學的深度應用\n\n✔️ 全面分析各項心理向度，評估職缺與文化適配度\n✔️ 美加澳上市公司，賓士、UiPATH都是忠實客戶\n✔️ 精準方案直接預測業績 (或任何有具體數值的 KPI)\n✔️ 客製化測評，細緻度遠超越 DISC 與 MBTI\n✔️ 打敗經驗偏誤，真正為你產生數據化的人資策略"], ["E3-07", "鑫玉全", "鑫玉全有限公司深耕屏東，以傳統五金為根基、數位創新為核心。致力於傳統產業的數位轉型。透過自主研發的KMOS ERP 系統與品牌行銷服務，我們直擊產業痛點，協助企業精準優化進銷存管理、提升品牌價值，是傳統產業實現永續經營的最佳策略夥伴。\n\n旗下行銷公司：墨望行銷\n主要協助台灣優質廠商走向國際，以「數據導向策略」作為核心。我們提供以下服務：\n1. 品牌策略規劃與定位：確立海外與國內市場的品牌話語權與差異化優勢。不論是深耕在地市場還是拓展國際版圖，皆能精準建立專屬的品牌護城河與市場防線。\n2. 數位行銷 / AEO 內容策略：以網站文章 GEO（Generative Engine Optimization）與多元數位管道，不只精準觸達目標客群，更能為國內品牌在本地搜尋與 AI 時代中搶佔關鍵能見度，實現高效引流。\n3. 產品全週期管理（涵蓋國內與跨境雙軌）：透過全方位的數據監控，從產品開發、國內營運出貨、到終端銷售與海外出海，進行全生命週期的數據化優化。\n\n\n我們確保客戶走在正確的賽道上，並透過 LinkedIn 進行全球規模化觸達，結合 AIO（AI 優化）與競品工具動態調整策略，協助台灣五金與傳統製造業順利出海，用數據翻轉全球市場。"], ["E3-08", "簡直科技", "一、協助中小企業快速找到合適人才\n\n許多中小企業在人力資源有限的情況下，往往無法投入大量時間進行招募作業。傳統招募方式需要大量閱讀履歷、安排面試及篩選候選人，不僅耗費時間，也容易因資訊不足而錯失優秀人才。\n\n簡直科技透過 AI 智能媒合系統，分析企業職缺需求、工作內容、技能條件與企業文化，同時解析求職者履歷、專業技能、工作經歷及職涯發展方向，進行精準配對，大幅提升招募成功率。\n\n二、降低企業招募成本與時間\n\n透過 AI 自動化篩選機制，企業可快速獲得符合條件的人才推薦名單，減少人工篩選履歷所需時間。\n\n實際應用效益包括：\n\n縮短招募週期、降低人資作業成本、提升面試邀約成功率、降低錯誤聘用風險、提高員工留任率\n對於沒有專職 HR 團隊的中小企業而言，可有效解決人力招募資源不足的問題。\n\n三、協助企業數位轉型與智慧招募\n\n在缺工與人才競爭日益激烈的環境下，中小企業需要更有效率的人才取得方式。\n\n簡直科技透過 AI 技術協助企業建立智慧招募流程，包括：\n\nAI 履歷分析、AI 人才推薦、AI 職缺匹配、AI 人才資料庫管理、AI 招募數據分析，讓企業從傳統人工作業轉型為數據驅動的人才管理模式。\n\n四、解決中小企業常見經營問題\n\n簡直科技的服務可直接協助企業解決以下問題：\n\n\nAI精準人才媒合、AI自動履歷分析、AI快速推薦候選人、AI自動化招募流程、降低招募與面試成本、提升人職匹配度\n\n\n五、服務對象\n\n主要服務對象包含：\n\n中小企業、新創公司、科技公司、傳統產業、製造業、服務業、零售業、連鎖品牌\n協助企業快速建立穩定的人才供給管道，提升組織競爭力與營運效率。\n\n簡直科技期望透過 AI 技術，成為中小企業在人才招募與人力資源管理上的最佳夥伴，協助企業解決缺工問題，提升經營效率與成長動能。"], ["E3-09", "強捷科技", "Mind Interview 帶來的「AI 招募體驗」\n\n• 跨平台精準搜尋 → AI 理解職缺需求，自動找到最佳人選\n• 個人化自動邀請 → AI 依候選人特質生成訊息，吸引力大幅提升\n• 24/7 AI 面試官 → 候選人可隨時進行初面，不受時地限制\n• 智能分析報告 → 不只看履歷，更能評估專業力與人格特質\n\n這不只是「自動化」，而是真正 AI 驅動的招募升級。\n\n我們的觀點:\n\nAI 不是要取代 HR，而是解放 HR。\n\nAI 幫我們解決重複性、耗時的工作，讓企業HR 專注在：\n\n⬆️品牌形象\n⬆️更深度的面談\n⬆️更好的候選人體驗\n⬆️更長遠的人才策略"], ["E3-10", "美商金卡", "Jinka 是一家專注於軟體開發與數據工程的技術顧問公司，協助企業運用數據、AI 與自動化技術提升營運效率，並支援業務擴展與數位轉型。\n\n我們提供客製化軟體開發、AI 解決方案整合、數據平台與架構建置，以及兼任技術長（Fractional CTO）服務，幫助企業以創造實際且可衡量的成果為目標。"], ["E3-11", "頂尖獵人", "頂尖獵人組織的使命是匯聚卓越的專業人士，我們提供的平台，讓多元專業技術和自由創意盡情展現。\n\n我們追求改革合作模式，讓人們透過此平台找到解決問題之道，並共同建立一個完善的頂尖獵人組織。\n\n透過匯聚作家、設計師、製作人、攝影師、企業主以及來自數百個行業的專業人士，我們為頂尖獵人平台注入了活力，夢想成為一個能為個人、社會或國家提供力量的組織，讓更多人共同努力，發揮影響力。"], ["E3-12", "彩紀資訊", "彩紀資訊是一家成立於2022年12月的軟體開發新創公司。我們致力於運用先進的技術與創新的思維，為客戶提供高質量的軟體解決方案。公司專注於軟體研發與技術創新，擁有一支充滿熱情與專業能力的開發團隊。我們致力於幫助企業數位轉型，通過定制化的軟體開發服務，滿足不同行業的多樣化需求。彩紀資訊秉持著「技術驅動創新，服務成就卓越」的理念，致力於成為客戶信賴的技術夥伴。"], ["E3-13", "艾鉑金科技", "財政簿長，你的專屬AI會計師，一站式智能財稅管理系統。我們使用各類AI工具，優化 記帳/財務/稅務/審計的重複性財稅工作，在符合各國會計準則的前提下，讓企業財稅管理及營運提升更智慧。讓記帳/財報生成/合法節稅/現金流管理，能更簡單、更智慧、更專業、更有效率。"], ["E3-14", "萊芙文創", "以AR擴增實境技術，帶動寵物相關產業，運用在如寵物生命禮儀，3D列印設計，產品設計，寵物生技食品，宗教文創產業，飾品珠寶產業等。近期專注於生成式 AI 落地應用，以「All in LINE」策略開發微型企業專屬的 AI 行銷協作平台，致力透過普惠科技消除數位落差、緩解產業缺工壓力。"], ["E3-15", "加貝電車科技", "加貝電車科技有限公司以 RE:TESLA LAB 作為對外品牌，主要服務特斯拉車主與維修相關業者。我們從零件鑑定、事故修復到車輛後續處理出發，希望讓特斯拉維修與零件流通的過程更清楚、更有效率。\n目前公司規劃三項主要服務，分別為 RE:CORE 特斯拉零件鑑定分級資料庫、RE:STORE 特斯拉事故修復服務，以及 RE:CARE 特斯拉一站式後處理中心。我們會協助車主與維修端進行車況判斷、零件比對、維修規劃與修復後檢查，減少事故或維修過程中資訊不清楚、溝通時間過長的問題。\n未來我們也會持續建立特斯拉零件資料與分級標準，讓可用零件能被更準確地整理與再利用，同時提供車主在事故後或維修時更完整的協助。"], ["E3-16", "犀動智能", "犀動智能（Aiello）是專注於自然語言處理（NLP）與智慧語音自動化的 AI 解決方案領導品牌，致力於透過 AI 技術提升企業營運效率與客戶互動體驗。其核心產品 Aiello One 一站式 AI SaaS 平台，結合先進 AI 技術與數據洞察，協助企業整合多元服務接觸點，優化營運流程並創造商業價值。\n\n旗艦產品 AI 智慧語音助理小美犀（Aiello Voice Assistant, AVA）屢獲國際肯定，目前已於亞太地區廣泛應用，導入超過 200+ 家企業與品牌場域，累積超過 1.2 億次互動，並成功解決逾 600 萬項客戶需求。Aiello 持續透過 AI 技術推動各產業數位轉型，打造更高效且具競爭力的營運模式。"], ["E3-17", "億中人行銷", "Infiniting Lab 聚焦 AI、自動化與微系統，協助中小企業、專業服務者與早期團隊，把分散在表單、訊息、合作對話與營運流程中的需求、問題線索與回饋，整理成可追蹤、可審閱、可逐步自動化的數位管理流程。\n\n目前已完成公開主站、需求收集入口與公開安全儀表板雛形。公開展示僅呈現聚合指標與系統健康狀態，不公開個人聯絡資訊或單筆私人內容。\n\n本次參展希望驗證企業在數位管理、企業效率、AI 自動化與資料流整理上的真實需求，並尋找早期使用者、合作夥伴與可共創的應用場景。"], ["E3-18", "富琍科技", "滿滿多元福利整合平台，是福委推動福利政策的好幫手。數位驅使下，企業紛紛以科技方式執行福委會務，滿滿不僅是一個數位福利平台，我們也將所有提案盡可能融入ESG，幫助企業實踐真正符合時代趨勢的『彈性福利』、『自選式福利』。滿滿以服務企業員工為重點核心，專注協助員工福利轉型的企業，提供員工福利多元化解決方案，如員工身份驗證、點數管理、福利商品、電子憑證、優惠集購等多項功能外，在特約服務更提供企業員工享有全台灣超過10,000間特約商店優惠，整合虛擬、實體店舖，食衣住行育樂通通有。\n\n滿滿團隊是由一群專業、熱情、有使命感的人所組成，我們致力於打造全台灣最多元化的福委平台，讓企業員工從日常休閒生活，皆可感受到資訊科技帶來的高效與便利。"], ["E3-19", "創蔚國際", "創蔚國際是一間專注於企業數位轉型的資訊服務公司，憑藉超過15年的深厚數位轉型經驗，為企業建構專屬且具擴充性的數位系統。我們的核心業務涵蓋：ERP 系統整合導入、條碼與履歷場景應用、雲端與網路資安架構部署，以及數位商務與電商營運整合，並提供從流程優化到數位轉型陪跑的一站式顧問服務。\n在協助各產業升級的同時，我們觀察到傳統宗教場域的數位斷層，因此創蔚國際結合既有數位化優勢及成員在宮廟擔任管理幹部的實際經驗，以「在宮掌櫃遇見你的神明」為理念，自研了「宮掌櫃」SaaS 宮廟管理平台。該平台針對宮廟行政繁瑣、信眾流失與欠缺數位管理工具等痛點，提供流程數位化與行動化體驗方案，並串聯信眾、廟方與第三方廠商，期望以數位韌性推動文化永續，建構獨有的數位宗教生態系平台。"], ["E3-20", "巷導科技", "巷導科技成立於 2025 年，為房產科技（PropTech）新創公司，致力於應用資料整合與地圖技術，為找房者解決資訊分散的問題。巷導科技定義「生活圈先決」找房新標準，推出「從生活圈出發的找房地圖」巷導，藉由融合交通、生活機能與房源資訊，幫助使用者用更直覺的方式找到合適的房屋，並持續以產品與技術創新，推動房地產市場透明化。"], ["E3-21", "備客", "Bicome 備客股份有限公司是台灣專注於私域社群與用戶營運管理的領航者。在流量紅利見頂、市場競爭激烈的荒野中，Bicome 扮演「拓荒者聯盟」的角色，運用獨創的《私域營運方法論》與自研 AI 技術，協助品牌與個人 IP 從「獵捕流量」轉向「精細化留存」，打造強韌的 D2C（Direct-to-Consumer）私域流量生態系。\n\n我們以「用戶營運專業」與「數據智能」為核心，提供三大拓荒利器：透過私域流量營運精細經營核心社群，建立高黏著度的品牌防線；運用私域 MCN 佈局 KOC（微網紅）影響力網絡，驅動長尾效應；並導入 AI 技術服務優化消費者行為數據解碼，以智慧工具賦能決策，讓品牌營運更高效。\n\nBicome 的使命是幫助品牌建立自有的私域營地，在短期內快速集結鐵粉，中期提升導購與覆購率，長期養成高度信任的「超級用戶」，實現可預測、可擴張且可持續的商業成長。\n\n我們秉持「持續復盤、團隊協作、高效學習」的拓荒者信條，矢志成為台灣最具影響力的用戶營運管理公司，與品牌攜手在未知的市場荒野中，點燃綿延不絕的繁榮營火。"], ["E3-22", "海博利邁科技", "Memofi 是你的智慧高效學習助理，幫助你在各科目與語言上達成真正目標。24 小時隨時與 AI 導師與對話夥伴練習，提供面試、旅遊、簡報等客製情境。拍照或聊天即可即時建立學習素材：抽認卡、測驗、重點摘要與單字表，完整依你量身打造。\n多元題型與遊戲化練習搭配精準評分，讓你保持動力，迅速建立自信。從考試與證照到職涯成長與海外旅行，Memofi 都是你的全方位學習夥伴。立即下載，開始更聰明地學習。"], ["E3-23", "宇果國際行銷", "宇果國際行銷（UGO Tech） 是一家專注於 LINE@ 私域行銷 與 LINE@ 生態系統規劃 的數位科技行銷公司。\n\n我們以「數據驅動、精準留存」為核心，致力於協助企業打破傳統行銷的高獲客成本僵局。宇果團隊專精於 LINE 官方帳號的深度經營，從零構建完整的私域流量池，提供包含自動化行銷腳本、分眾標籤管理、CRM 系統整合以及 LINE 模組化生態系規劃等全方位解決方案。我們不只幫品牌獲客，更透過高度客製化的互動設計，提升用戶黏著度與終身價值（LTV），陪伴企業在私域戰場中實現自動化變現與永續增長。"], ["E3-24", "適才科技", "適才科技於 2026 全新推出企業級 AI Agent / AI Dev 管理 PaaS 解決方案 AI GO。能協助沒有技術人員的中小企業也能在 1 個月內快速導入 AI 轉型，搭配 FDE 到客戶端進行原型驗證，並也領先市場提出營運成效提升保證。"], ["E3-25", "聚選匯雲", "聚選匯雲於 2022 年成立雲端服務品牌『COCloud』旗下共銷售代理 7＋中國公有雲及國際公有雲。COCloud 瞄準的對像為遊戲公司、電商、新創及微型企業、直播平台等，為其進行雲端架構規劃及上雲、搬遷服務提供客戶比雲端原廠更優惠價格，無論是雲端伺服器空間，亦或是提升網站服務品質之 CDN 加速器、DDoS 防護、資安防禦及簡訊發送系統等產品，24 小時一通電話皆有專人即時中英服務。"], ["E3-26", "擁樂數據", "COMMEET 是全台首家費用管理系統，提供創新運營思維，讓企業以更有效率的模式管理費用。\n\n企業可將費用政策設定到 COMMEET 上，透過系統把關，確保每筆花費皆在核可範圍，為不同支出項目設定客製化簽核流程，有效提升費用報銷效率。\n\nCOMMEET 為 Visa 在台指定商業夥伴，獨家推出數位企業卡服務，透過系統可設定每筆卡號交易限制，落實預算管理，同時解決過去員工代墊款的風險及負擔。\n\nCOMMEET 以科技落實管理目標，為企業達成 100% 即時管控。"], ["E3-27", "安特庫資訊", "AntQ 是一間資訊科技新創公司，聚集一群不到 30 歲的熱血青年，創辦人從事金融科技多年，曾經幫助 2 家新創公司成功進入市場！\n我們公司主要有3個業務：(1) 系統服務，例如體育相關的管理平台；(2) 企業專案，協助企業開發客製化系統；(3) 政府計畫，協助府機關建置與維護資訊系統。\n我們以合作精神和卓越品質為核心理念，AntQ Tech 融合了「Ant」與「Quality」，象徵著我們團隊的協作精神和完善的開發策略。"], ["E3-28", "創點子", "創點子媒體行銷專注於內容資產化、品牌行銷與 Canva AI 應用，協助企業整合內容、設計與 AI 工具，打造可持續成長的品牌影響力。"], ["E3-29", "中山永續金融科技", "中山永續金融科技股份有限公司專注於人工智慧投資分析與永續金融應用的新創公司，致力於運用 AI 技術提升投資研究效率與決策品質。團隊整合技術分析、基本面分析、新聞與市場情緒資料，以及 ESG 與氣候風險資訊，開發智慧投資分析與研究系統，協助投資人及金融機構更快速掌握市場機會與潛在風險。公司目前聚焦於 AI 個股分析、智慧選股、投資組合分析及 ESG 風險評估等應用場景，並持續推動金融科技與永續發展的結合。團隊成員來自國立中山大學、國立臺灣大學、香港科技大學、中正大學等校，具備金融、資料分析、人工智慧及創業實務背景。公司成立以來已進駐國立中山大學創業基地及高雄金融科技創新園區，並獲得天使投資支持。團隊曾獲中華民國科技管理學會獎項肯定，亦入選AWE女性創業學院等培育計畫，並持續參與國內外創新創業及金融科技交流活動。近年來，公司主辦 AI ESG 永續金融科技國際投資論壇及系列課程，累計培育超過百位青年學員，並與產官學界建立合作網絡。未來將持續深化 AI 投資決策系統、ESG 風險分析及金融機構應用服務，期望透過科技創新降低投資資訊門檻，推動台灣金融科技與亞洲資產管理產業發展。"], ["E3-30", "詠寶創新", "YOBOT 詠寶創新有限公司專注為中小企業工廠、海外台商工廠與成長型企業打造客製化 ERP 與新世代 AI ERP 系統。我們協助企業把原本分散在 Excel、LINE、紙本與人工回報中的訂單、採購、庫存、生產、出貨、成本與主管報表，整理成一套真正符合公司流程的管理系統。\n\n我們擁有十幾年跨產業系統開發經驗，接觸過成衣製造、生活用品製造、外貿五金、物流配送、貿易公司與多地工廠管理等不同產業。這些經驗讓我們更在意系統是否能在現場落地，而不是功能清單看起來多完整。\n\nYOBOT 的做法不是直接套用固定 ERP 模板，而是先理解企業每天實際怎麼接單、怎麼採購、怎麼控庫存、怎麼追生產、怎麼出貨與對帳，再依照真實流程設計系統。當資料流程建立後，也能進一步導入 AI 輔助判斷延誤、缺料、庫存、報價與毛利風險，幫助企業提升管理效率與決策速度。"], ["E3-31", "智遊旅程", "智遊旅程將為新世代旅遊提供科技面的協助。我們協助觀光旅遊產業數位化轉型，提供系統化、模組化、數據化，結合AI人工智慧與雲端運算SaaS服務。著重提升旅遊過程體驗式服務，引領整體觀光產業改變與成長。\n\n「3GTAPP」協助團體旅遊與活動舉辦，多方共用管理系統。\n「ToursCombine」提供自由行旅客一站式資訊整合平台。\n「GUIDEO」為觀光場域及遊客提供自動化導覽解說服務。"], ["E3-32", "大橡科技", "成立於 2019 年的 OakMega 是一間 Social CRM 公司，協助品牌經營 VIP 會員，打造即時的第一方資料源。\n\nOakMega 服務的產業多元，包括生技醫療、汽車、房地產等領域，目前已為超過 150 家台灣及國際品牌提供解決方案。OakMega 於 2020 年獲得 SparkLabs Taipei 國際加速器的投資，2021 年入選 500 Global 加速器及 Meet Taipei NEO Star 30。自 2023 年，OakMega 連續兩年受邀參與「日本・台灣新創高峰會 (Japan-Taiwan Startup Summit)」，並於 2024 年入選新創 100 大，同時獲得台灣野村總研諮詢顧問股份有限公司 (Nomura Research Institute: NRI) 的投資。\n\n世界瞬息萬變，不變的是我們努力打造出完美的 Social CRM 服務，協助企業更緊密地與顧客連結。"], ["E3-33", "蜂控科技", "我們專注於人工智慧（AI）與高效能運算（HPC）的實際應用，整合 AI 技術與雲端資源，提供從「研發、部署到維運」的一條龍服務，幫客戶打造既靈活又安全的 AI 應用環境。\n旗下核心產品「運算平台排程系統」，專為解決企業的硬體與資源調配痛點而生。透過聰明的排程優化，能幫企業省下大筆的採購與維運成本；同時提供「從服務到系統」的全方位客製化服務，讓企業不用擔心技術門檻，輕鬆完成數位轉型。"]],
    "f": [["F2-01", "遞伊家科技", "LINEFANS 2.0專注協助品牌透過 LINE官方帳號深度經營會員，打造品牌專屬的私域會員流量池，企業轉型O2M數位門市最佳解決方案。"], ["F3-01", "唯植有限公司", "WIZ 唯植是一個以植栽產品設計與商務送禮市場為核心的創業團隊。我們觀察到，現有植栽送禮產品多半停留在盆栽或花禮形式，較少兼具設計感、互動性與長期陪伴價值。因此，唯植以板材設計與上板蕨類為發展起點，透過不同階段的產品迭代，打造可依需求延伸的植栽禮品方案。從單純板材、板材搭配配件，到完整植栽模組，我們希望讓植栽不只是一次性的禮物，而是能持續生長、被照顧，也能傳遞心意與品牌價值的綠色送禮選擇。"], ["F3-02", "沃祈數位科技", "Worky 是台灣最具創新動能的 AI 智能人力媒合平台，致力於透過科技重塑零工經濟的運作模式。自2024 年 9 月上線以來，憑藉精準的媒合技術與友善的使用者體驗，深受年輕世代信賴。\nWorky 致力於解決當前勞動市場中「缺工」與「求職效率低落」的雙重問題。傳統求職流程，履歷與面試往往是主要篩選機制，但在數位化與 AI 工具普及時代，履歷的真實性與參考價值逐漸降低，企業招募時間與錯用成本同步提高。Worky 以此痛點為出發，重新設計人與工作的連結方式，讓「實際工作表現」取代「紙上履歷」，成為評估人才的主要依據。\nWorky承接現代勞動市場中逐漸增加的「非典型工作需求」。隨著 Z 世代與斜槓族群崛起，工作型態正由固定雇傭轉向彈性與多元收入來源，Worky 所提供的「AI 智能媒合」、「雙向評價信用累積」、「不須面試與履歷」，在新型態勞動市場中具備關鍵角色。"], ["F3-03", "AiStyle", "AiStyle 是你的 專屬 AI 造型師，每天24小時隨時陪伴，幫你解決「今天要穿什麼？」的煩惱。我們透過臉型、膚色、身形與風格的分析，為你挑選最適合的穿搭、妝容與配件，還能幫你管理數位衣櫥，甚至結合日曆與天氣，主動提醒每日穿搭靈感。\n\n和一般的購物平台不同，AiStyle 不是讓你買更多，而是幫你買對。透過 AI 的智慧推薦，你能更快找到屬於自己的風格，避免浪費時間與金錢，也能減少不必要的退貨與囤積。我們希望讓每個人都能 在日常生活裡展現自信與魅力。\n\n目前，已經有超過 800 位來自台灣、日本、韓國、泰國、菲律賓 的使用者加入我們的候補名單，期待搶先體驗 AiStyle。我們也正在開發更多功能，包括 AI 化妝教學、AR 虛擬試穿 與個人化購物推薦，打造一個屬於你的時尚生活圈。\n\nAiStyle 的使命是 「讓每個人展現最好的自己」。因為我們相信，美不只是外表，而是讓你在每天的選擇中，輕鬆感受到自信與快樂。"], ["F3-04", "飛德科技有限公司", "infFITS 主要專注於 AI 智慧電商的科技公司，致力於打造「購物決策層」的基礎設施，重塑消費者的購物體驗與品牌營運效率。\n\n美國發明專利技術為核心，推出兩大關鍵產品：\n\n● 智慧尺寸（Size AI）：透過 AI 與多維身形數據分析等數位孿生技術，即時提供個人化尺寸建議，解決尺寸不確定問題，加速購買決策並提升轉換率\n\n● 智慧選物（Recommendation AI）：結合用戶行為、商品資料與購物偏好，建立個人化推薦機制，顯著提升商品發現效率與營收表現\n\n透過這兩大 AI 引擎，infFITS 幫助品牌提升轉換 營運升級 打造超個人化的購物體驗。"]],
    "p": [["P1-01", "酷日國際", "Creww 是日本規模最大的企業加速器，擁有超過 8,500 家日本新創資料庫，約佔全國新創企業總數的七成。長年與日本大型企業集團與政府機構合作，推動超過 500 項企業加速計畫，累計促成 1,500 件新創合作案。自 2023 年起積極拓展全球佈局，成立 Creww Taiwan 與 Creww Korea，並與歐美企業展開戰略合作，例如 2024 年與西班牙皇家馬德里足球俱樂部攜手於亞洲舉辦新創徵案活動。\n2022 年，Creww 與工業技術研究院合作進駐台灣林口新創園；2023 年底，在高雄大港創艦設立 Creww Taiwan（酷日國際有限公司），自 2024 年起承接大港創艦營運，積極推動高雄與國際創新資源接軌。2025 年公司搬遷至台北信義區，目前於台北與高雄皆設有營運據點。\n酷日國際致力於串聯政府資源、企業需求與新創能量，打造開放式創新平台（Open Innovation ）。作為日本 Creww Inc. 在台唯一據點，導入日本成熟的新創加速與企業共創模式，協助台灣新創拓展海外市場，也為海外企業進入台灣提供合作橋樑。\nCreww Taiwan 已成功舉辦三屆「Creww台日新創企業加速計畫」，協助逾 200 家台灣新創對接日本大型企業，包括日本生命、東京瓦斯、日東製網、日本化妝品協會（JCC）、清水建設等。首創「企業實戰」取代傳統課程輔導的震撼式加速模式，實現跨國「大帶小」共創加速，協助台灣新創快速成長並拓展日本市場。"], ["P1-02", "臺中軟體園區智慧創新應用加速器\n頂騰創新", "DigiPark 頂騰創新服務有限公司, 由鼎新電腦、維正聯合會計師事務所及華登國際創投手打造的全新共享空間、共享資源.、共享服務..等資源媒合的提供者,目前主營業務積極推動【中軟數位轉型應用創新基地】建置，位於臺中軟體園區，基地面積約5000坪，以推動AIoT智能製造、加速器場域為宗旨。\n\n提供一站式智慧創新應用場域及加速器服務，將智慧創新解決方案成果應用於產業，推動各進駐廠商展現能量及跨領域異業合作，拓展人際與商機，同時提供與大型企業攜手合作的機會，快速打入國際供應鏈體系，創造共生共好雙贏商商業新契機！"], ["P1-03", "中華民國創業投資商業同業公會", "創投公會自成立迄今已超過20年，目前已成為全國創投產業的資訊中心，不但提供會員公司國內外相關產業訊息，並定期辦理投資商機媒合會等活動，以介紹潛力案源予會員公司，且已成功為許多創投公司及企業促成合作機會。另外亦協助會員與政府溝通，密切掌握及參與協調投資相關法令的協商，成為雙方溝通的橋樑。\n在歷任理事長之熱心參與會務，以及秘書長和全體同仁之共同努力下，以服務全體會員為基本精神，努力朝向為全體會員爭取權益及擔任會員與政府協商之橋樑為目標，持續穩健經營並陸續在多個領域交出亮麗的成績單。"], ["P1-04", "易威企業\n造夢基地共享空間", "關於 DreamMaker Hub造夢基地共享空間\n每個人都有夢想也有實踐自己想法的力量。\n所有想法可以經由簡單的方式嘗試。\nDreamMakerHub造夢基地共享空間\n-給造夢路上的你一個屬於自己的空間\n\n造夢基地共享空間擁有兩間分館，分別位於台南、高雄的黃金地段，不論是創業、辦活動、辦講座、會議室租借、當圖書館、工商設立登記都能為你服務。"]],
    "sig": [["SIG2-01", "南臺灣科研產業化平台", ""], ["SIG3-01", "陳玟帆老師研究團隊", "本公司致力於開發新世代高強度仿生生物陶瓷材料，結合精密3D列印技術，打造兼具高機械強度、骨誘導性與生物可降解性的客製化骨修復解決方案。我們突破傳統人工骨強度不足、無法承受負重及缺乏個人化設計的限制，能依據患者骨缺損部位與結構需求快速製作專屬植入物，應用於顱顏重建、脊椎融合、骨腫瘤切除後修復及大範圍承重骨缺損治療。"], ["SIG3-02", "周銘鐘教授團隊", "【全方位評估X光面板影像品質假體】本技術透過整合式圓形假體，一次即可完成影像解析度、對比度、均勻性及影像缺陷等多項指標評估，不僅能發現傳統假體難以檢測的影像品質不均問題，更可減少多種假體與重複檢測流程，協助企業降低檢測成本、提升檢測效率，並建立更可靠的影像品質管理機制，可應用於醫療設備廠商、醫院放射科及檢測機構。 臨床上評估X光面板造影系統的影像品質，會需要使用多種不同功能的假體，來評估不同面向的X光影像品質，包括：對比度、解析度及訊雜比，然而傳統假體的內部細節排列設計非對稱，因此無法用於評估影像品質不均勻的現象，本團隊發明的整合式圓形假體可以全方位評估X光面板的影像品質，該新式假體整合傳統的「調制轉換函數假體」、「對比細節假體」及「圓形階層假體」，藉此更全面地評估影像品質、對比度及解析度的不均勻現象。新型的X光假體除了可以獲得傳統假體無法分析的影像品質不均勻外，該假體設計製作成本較低，同時整合多種假體設計概念，因此可以節省醫院購買多種假體之費用，在市場上更有競爭力。"], ["SIG3-03", "蔡得民老師研究團隊", "本公司專注於減速機與齒輪傳動系統的設計與開發，致力於為各類自動化、機械設備與高精度傳動需求提供高效、可靠的動力解決方案。目前展出三項技術1、同軸式減速機構，具有緊湊的結構、高剛性以及依據設計需求可以彈性設計。2、雙包絡蝸桿蝸輪減速機，通過AGMA規範設計雙包絡蝸桿蝸輪，利用4軸CNC加工機完成加工。3、滾珠式減速機，屬於正交減速機，特點為利用滾珠作為傳動件，降低成本的同時還能維持減速機運作。"], ["SIG3-04", "王政弘老師研究團隊", "透過虛擬實境進入教育元宇宙平臺(EWova)，人與人能夠不受時間與場域限制，創建專屬虛擬分身，並穿梭各個虛擬空間進行多人互動與學習。 同時教師身分能夠開設虛擬課程、上傳課程資料、派發學習獎勵寵物等，並可觀看學生學習歷程。 學生身分能夠進行表情符號互動與3D模型觀察及小組討論，進行共學與共創。教育元宇宙平臺(EWova)具有許多區域，無論是組內共學、組間互學、教師導學或是學生自學，都能夠在這裡進行與完成。 EWova教育元宇宙系統以虛擬實境（VR）、延展實境（XR）、生成式AI及3D互動技術為核心，打造兼具沉浸式、互動式與智慧化的教學環境，支援多元教學模式與跨域學習需求。"], ["SIG3-05", "俞玉智教授團隊", "高雄醫學大學是台灣南部及亞太地區的領先醫學大學，擁有逾七十年的醫學卓越歷史。高醫大的實力在於優秀的學生，我們每年都招收全國最優秀的學生。大學不僅是醫務人員的培訓機構，也是培養最優秀的醫療專業人才和領袖的卓越中心，以促進社會進步。\n\n【便攜式睡眠呼吸中止症治療裝置】\n\n睡眠呼吸中止症因上呼吸道塌陷導致反覆呼吸中斷，可能引發心血管及代謝疾病。部分患者無法接受手術，且對CPAP或口內裝置的順從性較差。因此，我們開發了一款無感、便攜的治療裝置，以滿足臨床需求。本裝置提供穩定的呼氣末正壓（PEEP），有效防止上呼吸道塌陷。相較於其他產品，它具備可變進出氣口直徑設計，提升治療效果。"], ["SIG3-06", "魏春旺教授團隊", "高雄醫學大學是台灣南部及亞太地區的領先醫學大學，擁有逾七十年的醫學卓越歷史。高醫大的實力在於優秀的學生，我們每年都招收全國最優秀的學生。大學不僅是醫務人員的培訓機構，也是培養最優秀的醫療專業人才和領袖的卓越中心，以促進社會進步。\n\n【寶寶哨兵御守】\n\n「寶寶御守」運用YOLOv8物件偵測技術,透過遷移學習訓練模型,讓小型運算中心可以進行即時影像辨識危險物品,並以影像測距技術測量寶寶與其之距離。當距離過近時,小型運算中心將傳送警示訊息至使用者App, 提醒照顧者關注寶寶,並於每個月提供寶寶經常碰觸危險物品分析。本產品應用範圍非常廣泛,主要針對家庭中有7個月至2歲嬰幼兒的家庭，亦可協助保育人員監控多個幼兒,提高保育品質並降低意外事故發生的風險。"], ["SIG3-07", "許瑞允老師研究團隊", "本技術涵蓋鈣鈦礦太陽能電池從材料設計、元件製程、薄膜分析到人工智慧輔助最佳化之完整研發能量，分為兩大平台。一為反式鈣鈦礦製程技術，以4PABCz自組裝層進行界面修飾，並導入APCl表面鈍化降低薄膜缺陷與漏電，提升元件效率與穩定性。二為模擬與AI輔助設計平台，以SCAPS-1D建立無鉛雙吸收層元件模型，結合XGBoost與SHAP分析預測效率並判讀關鍵參數，縮短材料篩選與最佳化時間。整合實驗驗證與數據驅動設計，可支撐高效率、低毒性、高穩定性太陽能電池技術之開發，應用於綠能發電與淨零永續。 本技術結合SCAPS-1D元件模擬、XGBoost機器學習及SHAP可解釋性分析，能快速預測材料與製程參數對元件效率的影響，大幅縮短材料篩選及製程最佳化時間，降低研發成本，形成「實驗驗證＋AI數據驅動」的研發模式。在鈍化條件下，本成果元件光電轉換效率（PCE）分布比較，雙重修飾使效率由約16%提升至約22%。"], ["SIG3-08", "曹文昌助理教授研究團隊", "隨著海洋開發與水下監測技術發展，水聲器（Hydrophone）於環境監測與海洋生態保護中的應用日益重要。然而，現有水聲器固定方式如懸掛、吸附或剛性夾持，易受水流、材質限制與機械應力影響，造成量測不穩定與精度下降。為改善上述問題，本案提出一種水聲器量測器，提供穩定、靈活且具高適應性的固定方案。其結構分為上、中、下三部分：上部設有平台與水平儀，用以確認支架水平狀態；中部包含水聲器安裝座與可調式圓管，可依不同水深調整位置與長度；下部則為具錐狀腳柱之底座，可深入水床以提升穩定性並降低對水中生物之影響。整體設計可有效減少外部干擾，提高水下噪音量測之準確性與可靠性。"], ["SIG3-09", "陳志堅教授研究團隊", "本技術主要應用於水產養殖場、種苗繁殖場、水產品檢驗實驗室及政府防疫檢測單位，可提供養殖現場快速DNA檢測、AI智慧判讀及雲端遠端監控等功能。 相較於傳統需送實驗室檢測的流程，本系統能有效縮短檢測時間，降低人工判讀誤差，並透過AI自動分析螢光反應與手機APP即時回傳檢測結果，協助養殖業者及早發現病原、迅速採取防疫措施，降低疾病擴散及經濟損失。同時，所有檢測數據可同步上傳雲端，建立完整的歷史資料與管理紀錄，提升養殖場智慧化管理效率，促進智慧養殖、精準防疫及數位化管理之應用發展。"], ["SIG3-10", "楊忠原助理教授研究團隊", "屏東平原之農業發展仰賴北大武山系豐沛水源，高屏地區灌溉渠道縱橫交錯，是精準農 業發展的重要場域。然而，現行農田水利管理仍多倚賴人工巡查，面對農業缺工與氣候變遷 導致的水資源不穩，導入自動化監測已刻不容緩。 經實地考察發現，推動農業物聯網（IoT） 的最大瓶頸並非感測技術，而是「電力取得」。灌溉溝渠多位於野外，架設市電成本極高， 而依賴電池供電之感測器，不僅維護頻率高（需定期更換電池），廢棄電池亦造成環境負擔。 既有溝渠中川流不息的水能長期被視為背景環境，實則蘊含穩定的能源。因此，本計畫旨在 開發一套「擷取溝渠水能自供電」的監控系統，解決戶外場域供電痛點，達成水資源管理的永續與智能化。 1. 自供電解決供電痛點： 利用溝渠微水力結合太陽能發電，搭配儲能系統，擺脫市電與電池更換限制，降低維護成本與環境負擔。 2.永續能源，減碳環保： 以再生能源取代傳統電力，降低碳排放，支持 ESG 永續發展，實踐綠能與資源永續管理。 3. 智能監測，即時決策： IoT 感測器即時監測水位、流速與發電狀態，透過 LoRa 傳輸與 AIoT 平台分析，提供即時告警與趨勢預測。 4.遠端管理，提升效率： 雲端儀表板整合能源與水情數據，支援遠端監控與異常判斷，減少人力巡檢，提升管理效率與韌性。 5.在地應用，擴散永續價值： 系統模組化、低成本、易維護，適合偏鄉與農業場域，推動綠能科技落地，創造在地永續價值。"], ["SIG3-11", "黃惟泰教授研究團隊", "本技術主要針對現有超音波振動輔助磨削系統在實際應用上的不足加以改良。突破了傳統系統體積龐大、安裝不便、頻率無法調整以及能耗過高等問題。本研究所研發之節能高效率超音波振動輔助磨削系統，採用智慧化建模方式優化至振系統幾何結構，使其在超音波最低頻率20 kHz 下即可達到最大系統振幅量。採用外掛式模組化設計，可單獨推廣與銷售，並能輕易安裝於國內外各類磨削工具機上使用，大幅提升原有磨削工具機加工性能與效益，無需額外投入大量資金重新購置超音波振動輔助磨削專用工具機。本技術特別適用於加工高硬度合金等特殊材料。其應用可有效提升磨削效率，協助製造業降低碳排放、達成碳中和目標，並對相關產業的綠色製造技術發展作出貢獻。"], ["SIG3-12", "吳榮慶老師研究團隊", "本產品為一款結合深度學習、電腦視覺與網頁平台技術的「自動化斜視影像輔助評估系統」。斜視若未及早介入治療容易影響視覺功能發展，然而傳統評估高度仰賴專業醫師與醫療場域，對於偏鄉或行動不便的族群較為不利，易錯失早期檢測時機。 為解決此痛點，本系統提供一套低門檻、具即時回饋能力的初步篩檢工具。使用者僅需透過手機或電腦等常見網路攝像頭拍攝眼部影像，系統即會自動將影像上傳至伺服器端進行即時分析。在核心技術上，本系統採用 YOLOv8 模型進行多目標偵測與精確分割，能同步且穩定地定位眼部及虹膜邊界。接著搭配二值化、HSV 色彩過濾、霍夫圓變換與 Canny 邊緣檢測等影像處理技術，精準萃取出虹膜中心與角膜反光點。 本系統的最大亮點在於創新整合了雙軌檢測機制：結合「眼角距離比值法」與改良版的「反光點偏移判斷法」。這套機制不僅能克服華人深色虹膜造成的定位誤差，還能有效辨識假性斜視並分類斜視種類（如內、外、下斜視），大幅提升系統在不同光線與距離下的實用性。 透過「易操作、易理解」的直覺化介面，本服務期望能協助一般民眾進行便利的居家初步評估，作為就醫前的參考依據，進而促進斜視的早期發現與治療，同時也能協助減輕臨床醫師的工作負擔。"], ["SIG3-13", "劉麗芬老師研究團隊", "本創新式螢光醣探針，是一種營養物腫瘤顯影劑，無需外接化學螢光基團就能以UVA波長激發就能產生高亮度的可見螢光，細胞吸收後經4小時後就會被當成能量代謝，因此對細胞不會產生毒性，術後檢體經螢光醣顯影劑浸泡，能快速找出腫瘤組織部位與進行48小時藥物敏感性檢測之用藥預測，有利於臨床快速評估癌症治療用藥方針。"], ["SIG3-14", "唯柏企業", "唯柏企業有限公司以「植物纖維取纖設備研發」為核心，致力於開發適用於香蕉假莖、鳳梨葉等多元植物原料之取纖機械設備，協助農業副產物從廢棄物轉化為可再利用的天然纖維材料\n\n公司以機械製造、場域測試與材料應用整合為發展方向，透過取纖設備優化、原料測試、參數建立與客戶導入服務，協助農業、材料、文創、教育與循環經濟等領域建立天然纖維應用基礎\n\n唯柏企業期望不只是製造機械，而是成為天然纖維材料轉換的起點。未來將持續推動智慧化取纖設備研發，結合 ESG、循環經濟與農業剩餘資源再利用，協助在地農業創造新價值，並拓展天然纖維於國內外市場的應用可能"], ["SIG3-15", "吾手四四企業社", "Wooso 吾手是一個創意品牌，透過材料、工具與創作體驗，啟發人們的好奇心與創造力。我們重視創作與探索的過程，相信每個人都擁有創造力，致力於打造一個每個人都能自在創作的世界。近年來，持續投入永續纖維、農業廢棄物再利用與材料教育的研究與推廣，透過創作體驗引導大眾認識材料來源、循環設計與永續價值。\n\n擁有榮獲台灣專利之改良式織布機，100%在地手工訂製。大幅降低初學者學習門檻，並極小化織造過程的餘紗耗材。\n結合ESG與SDGs理念，發展出「廢料升級再造（Upcycling）」，能針對企業設計 ESG 產品以及Workshop。將企業製程所產生的二手衣物、廢棄紗線與邊角料，透過編織轉化為再生文創工藝品。將抽象的 SDGs 精神轉化為可互動、具高傳播價值的綠色手作體驗，高效實踐企業社會責任，透過永續教育，完美傳承活化傳統工藝。"], ["SIG3-16", "於旭設計團隊", "怡旭品牌設計策略顧問，是由一群具備研發精神並且對文化設計與創意有著高度投入熱忱的專業夥伴集聚而成，由於成員背景來自產業界與學界師生的集結，在專業領域上均曾創下佳績，具備有從商品研發、品牌視覺規劃、形象包裝結構開發與視覺設計，以至市場定位與行銷策略訂定之專業力執行團隊，本團隊成員並且具備多項專利申請通過之實際設計品項與技術，並經歷專利及非專利授權專案，秉持積極的態度以創新思維落實生活，期以協助發掘文化導入創意生活更具新意、豐富樂趣為目標。\n本團隊的服務能涵蓋的行銷規劃，有別於目前一般設計團隊的專屬服務特點，能讓專案客戶從開始接觸企劃時，就能顧及市場與銷售端的管理以為專案進行之輔助考量，也因而能藉此讓文化行於創意時，更易落實於現實市場中，我們的團隊始終主張-「讓品牌成為服務開端，策略以為成功的開始」。"]],
    "cx-07": [["CX-07", "千鉑國際科技有限公司", "千鉑國際科技專注於企業AI整合應用、跨系統串接與智慧製造場域建置，提供地端LLM / RAG、企業知識庫、AI Agent、工業嵌入式與視覺辨識等解決方案，協助企業整合內部文件、系統資料與工作流程，加速數位轉型與智慧化升級。"], ["CX-07", "錦威再生科技股份有限公司", "電池產生的環境廢棄物正以前所未有的速度成長。錦威將再生理念創造出循環利用奇蹟，我們相信利用人工智慧，必能在扭轉環境污染趨勢，發揮至關重要的作用。我們的循環電池生態系統，從根本融入了 ESG原則。我們的目標是創造一個電池無限循環的世界，為設備和車輛提供能源，同時消除浪費，並在各產業和社區中大幅降低碳足跡。每一顆回收的電池，都是創新與使命的最佳證明"], ["CX-07", "帕亞科技股份有限公司", "帕亞科技打造結合遊戲化學習與數位孿生的 AI 教育平台，讓學生能實際訓練並部署機器人，連結學校與產業應用場域。"], ["CX-07", "長聯科技股份有限公司", "長聯科技專注醫療AI機器人與智慧醫療方案，結合生成式AI、LLM與自主移動技術提升營運效率。我們秉持臨床共創、高規格資安防護，打造安全可靠的智慧照護生態系統，全面推動醫療數位轉型與發展。"], ["CX-07", "巨明生醫股份有限公司", "**定位與價值** 巨明生醫定位為「預防醫學的AI肌肉品質標準制定者」，由成大兩位臨床醫師創辦。兩位醫師深耕放射腫瘤與影像醫學領域，洞察肌肉品質量化的臨床痛點，結合核心創始團隊統計建模專長，開發突破性解決方案。\n\n**核心技術與產品** 我們的產品**CanWellBeing**以自研演算法，僅需腹部CT單切面，3秒全自動分割肌群、分析脂肪浸潤與肌肉密度，量化輸出70+項身體組成指標，將「肌肉品質」從不可見轉化為可量化、可追蹤、可決策的精準數據。產品已取得臺灣醫療器材許可並實際落地臨床應用，並取得美國、歐洲、日本與台灣多國發明專利。\n\n**獨特競爭優勢** ① **技術領先**：專利技術專攻腹部核心肌群，能識別高肌肉量的「偽健康」族群，補現有健檢僅測肌量的關鍵缺口 ② 突破傳統**臨床限制**：將過去臨床上需要專科醫師定量的40分鐘流程縮短至3秒鐘，非侵入且準確，結合大數據，即時預測慢性病風險 ③ **商業模式創新**：「Software + Data」雙引擎，橫跨醫療健檢、健身保健、藥廠醫療、保險公衛四大領域\n\n**市場願景** 瞄準AI醫療影像預防醫學市場（2024-2033年：1.4B→20B美元，CAGR 34.7%），已獲成大醫院訂單並取得台南市衛生局健保自費碼，未來將一步步將肌肉品質打造為健康生態系的「共通貨幣」，並延伸便攜式超音波與SaaS服務，建立可持續擴張的產業標準，創造可複製、可規模化的商業價值。"], ["CX-07", "得美醫用創新科技股份有限公司", "我們的旗艦產品 GPSR_M2 Plus 可在接近傷口溫度的條件下提供含有活性解離物質的電漿體。它是一款高性能、易於使用的電漿醫療系統，專為滿足各種傷口護理需求而設計。本產品適用於糖尿病足潰瘍和壓瘡等慢性傷口；也適用於微創手術和燒傷等急性傷口。本產品符合國際醫療器材安全標準，並採用專利技術，包括第一氣體活化、第二氣體冷卻和豐富的活化物質，從而實現對電漿品質輸出的精確控制。 GPSR_M2 Plus 的動物試驗和首次臨床試驗數據支持以下功效：對慢性傷口具有抗菌作用、改善傷口微環境以及調節傷口癒合過程。"], ["CX-07", "季享未來科技股份有限公司", "季享未來打造AI驅動的智慧服務解決方案，融合AI虛擬人、服務型機器人、多模態互動與智慧場域技術，提供導覽接待、資訊服務及人機協作應用。透過AI與機器人的整合創新，協助各類場域提升服務品質、營運效率與數位體驗。"], ["CX-07", "邯武科技有限公司", "邯武科技有限公司創立於2021年9月，總部位於台南市歸仁區，由共同創辦人兼執行長黃泓翔領軍，現有團隊13人。公司以「系統數位化、流程自動化」為核心定位，採微服務架構與多租戶SaaS平台，致力打造模組化、可擴展且易整合的企業管理工具。\n\n尚未有人認領\n申請成為公司管理員"], ["CX-07", "循跡科技股份有限公司", "循跡科技專注企業管理與數位治理解決方案，結合AI技術打造資安、隱私及風險管理系統。透過智慧分析與自動化流程，協助企業提升效率、降低風險並符合國際法規，全面推動數位轉型與永續發展。"]],
    "ep-02": [["EP-02", "立創光電股份有限公司", "立創光電專注於精密光學量測與太空級光電模組的高科技製造商，總部位於高雄。公司以自主研發的量測技術起家，廣泛應用於半導體、太空、太陽能等產業之檢測。\n\n立創光電已具備太空衛星用太陽能模組之量產能力並通過實際太空環境驗證（飛行履歷），仍持續取得相關訂單。\n\n結合精密光學量測的深厚技術底蘊與太空級製造品質，立創光電致力成為臺灣太空產業供應鏈中值得信賴的光電模組與檢測設備夥伴，協助客戶在地面與太空應用中實現高可靠度的量測與能源解決方案。"], ["EP-02", "睿思智慧股份有限公司", "睿思智慧專注於提供 AI 解決方案，幫助企業提升運營效率，尤其是在業務和客服自動化方面。\n我們的核心產品是 CROSSBOT，一個智能客服助理平台。CROSSBOT 能夠串接各大社群平台，如 LINE 和 Facebook，協助企業進行會員管理及行為數據收集。除此之外，它還能與企業內部資料庫互動，提供即時的資訊和分析，進而提升銷售轉換率和優化業務流程。\n我們提供多種服務模式，包括軟體訂閱、客製化開發和數據分析，客戶可根據需求選擇最合適的服務方案。"], ["EP-02", "絕好聲創股份有限公司", "絕好聲創股份有限公司，致力打造下一代 AI 超擬真語音服務，發展 Voice AI，包含 AI 聲優, AI 聲音克隆, AI 虛擬人, AI Podcast, AI 有聲書, Voice API。絕好聲創的 超擬真台灣口音 AI 聲優，以極具辨識度、親切感的台灣口音作為亮點，讓 AI 合成聲音有「道地人情味」，更貼近台灣本地的影音多媒體製作及公眾廣播需求，可提供全球市場在中文 AI 人聲有更多的選擇，為台灣口音發聲，讓超擬真台灣口音 TTS 聲音可以更廣泛應用在各行各業。"], ["EP-02", "南瓜虛擬科技股份有限公司", "南瓜虛擬科技為 XR 遊戲和雲端與 AI 技術的專家，\nXR 軸心策略：最大化 XR 的價值。\n技術集成：利用 XR 技術並整合雲端和 AI 技術，提供最適合的產品和服務。\n擴展 XR 潛力：促進 XR 在各個領域的多元應用。"], ["EP-02", "博誠電子股份有限公司", "博誠電子是領先的客製化AI物聯網（AIoT）設備設計製造商與系統方案商，專注於提供創新且實用的多模態AI感測解決方案。我們的核心產品「魔塊物聯網傳感器」以其獨特的積木型設計傲視群倫，其最大特色是模組化的邊緣運算能力，能彈性依客戶需求快速整合適合的AI晶片，即時處理數據，滿足多元的邊緣運算應用需求。 博誠積極響應ESG趨勢，推出室內光供電技術，讓感測器能利用環境光源運作，大幅減少電池消耗，實現綠色永續。為方便選購，博誠打造了電子商城，讓客戶依應用需求輕鬆找到適合的魔塊模組。針對防災，我們的AI防災產品能透過智慧監測即時預警，有效解決災害問題。此外，博誠提供從前端感測到雲端平台的全方位軟硬體客製化整合服務，深度配合市場需求與上游業者，確保解決方案完美契合。"], ["EP-02", "愛吠的狗娛樂股份有限公司", "愛吠的狗娛樂股份有限公司(BarkingDog Technology Inc.)擅長開發AI+XR的虛實整合互動內容，公司成立滿六年，近期主打「AI AMAZE 慧星大使」AI擬真人智慧服務平臺，結合襲捲全球的ChatGPT生成式語言模型技術，獨家推出運用向量檢索架構開發出AI智慧客服應用，可適用於：觀光導覽 業務推廣；行銷互動 顧客服務；教育訓練 隨身助理。"], ["EP-02", "中華電信行動數位卡新創團隊", "Digital KeyRing (DKR) 協助企業將員工證、門禁卡、訪客證等傳統實體卡片整合至既有 App，支援 iOS 與 Android，快速完成數位身分導入。除了身份驗證與通行管理外，更能串接企業服務與工作流程，讓每一次手機感應都能創造新的服務價值，成為企業數位轉型的重要入口。"]],
    "cx-01": [["CX-01", "點點數位股份有限公司", "點點數位成立於2012年，團隊成員在業界具有豐富執業經驗，從網頁端服務與APP開發、系統服務、後端API、Linux作業系統驅動程式到Wi-Fi晶片開發，在軟體系統研發與整合有豐富的經驗。成立初期以資訊系統整合服務業務為主，團隊成員服務過的客戶包含全家便利商店、台積電慈善基金會、統一集團、無印良品、金車集團等。為提升公司整體競爭力，自2023年起轉型朝5G、AR、VR的應用服務與解決方案系統供應商努力，並於2024年與西門紅樓打造全新原生的3D數位IP「紅福」，並開發逾50項數位及實體週邊商品。"], ["CX-01", "嘉堂資訊有限公司高雄分公司", "嘉堂資訊是您擴展XR應用及優化數位雙生（Digital twin）解決方案的首選沉浸式技術合作夥伴，並為各行各業量身定制解決方案。\n將XR技術整合到智慧製造中，利用AR、VR和MR技術提供直觀、豐富的數位體驗。工人無需實際進入現場即可進行培訓、檢修和維護，減少風險並提高生產效率。XR技術還可模擬不同場景，增強工作效率和安全性。\nXR技術為智慧製造帶來了高效、安全的工作環境，推動了工業革新。"], ["CX-01", "鑫蘊林科股份有限公司", "Linker Vision 提供領先業界的電腦視覺 AI 解決方案，為智慧工廠、工安、智慧城市等各產業領域打造全方位的應用服務。透過自主研發的一站式 VisionAI 持續學習平台，運用獨家大型視覺模型技術，結合 NVIDIA Metropolis 的 TensorRT, DeepStream, TAO 等軟體套件，從一鍵部署零樣本 AI，加速挑樣訓練持續學習，到自動化標註海量資料，大幅加速 AI 佈建及服務擴展時程，快速提升企業核心 AI 能力，並節省建置所需的人力及成本。除此之外，平台更搭載 NVIDIA NIM 的生成式 AI 技術，創造突破性的使用體驗，導入多模態即時互動式 AI 快速精準掌握全局。"]],
    "cx-05": [["CX-05", "立安新創股份有限公司", "立安新創擁有母公司立國集團逾55年石化經驗，深入理解產業痛點，並以實務經驗切入，提出貼近現場需求的數位應用，成為石化業數位轉型的關鍵夥伴，協助業主推動客製化數位解決方案，解決人力短缺與技術斷層等挑戰。"], ["CX-05", "立特有限公司", "立特科技提供一個全方位的可視化管理系統，涵蓋能源管理（EMS）、設備管理（IoT）、微電網及碳盤查功能。我們的系統具備快速導入、降低成本和提高效率的優勢，為跨國企業乃至上市公司提供解決方案。透過立特科技的系統，企業可以輕鬆實現能源管理、碳盤查與設備管理的一站式需求，大幅提升運營效益與可持續發展能力。"], ["CX-05", "先進醫資股份有限公司", "先進醫資以數位資訊與人工智能重新定義智慧醫療及改變照護體驗，致力於提供以使用者需求與環境為核心的智慧醫療解決方案，產品涵蓋以獨家 docloop.ai人工智慧照護平台（享健康共照雲）與mHIS智慧醫院，整合雲端、行動、大數據等技術，推動醫療資訊創新。團隊具多年醫療系統開發經驗，曾參與國家電子病歷與多項國際公共衛生計畫，深耕國內外市場。 2021年團隊被《商業週刊》評選為最具SDG影響力的30大新創企業之一，投資人包括台灣醫療機構與美國矽谷的天使投資者，目前已投入多達 12個海外國家市場及近300家以上的醫療照護機構。"], ["CX-05", "有鳴股份有限公司", "有鳴股份有限公司除了開發智慧販賣機以外也是具備電子貨架開發與營運的一間公司。我們致力於幫助零售商和品牌創造引人入勝的購物體驗，同時提升銷售業績和顧客參與度。我們的產品結合了最新的數字顯示技術和智能管理系統，能夠有效地展示和管理商品信息。\n產品和服務：智能電子貨架： 配備高解析度的顯示屏幕，支持動態內容更新和互動功能，提供實時價格調整和促銷活動的能力。\n數據分析和管理平台： 提供客戶即時的銷售數據、庫存信息和顧客行為分析，幫助企業做出更明智的營銷和庫存管理決策\n客製化解決方案： 根據客戶需求，提供定制化的電子貨架設計和應用開發服務，確保最大化滿足業務需求。\n市場應用：\n產品廣泛應用於超市、百貨商店、專賣店以及展示銷售會場等各種零售場景。我們的解決方案不僅提升了商品展示效果，還加強了品牌形象，促進了顧客的購買決策和忠誠度。"], ["CX-05", "安美洛生醫股份有限公司", "安美洛生醫專注開發胺基酸螯合新型分子材料。其核心技術 MACS（金屬‑胺基酸鍵擊合成）可快速製備高純度金屬‑胺基酸複合物，應用領域包括生物農藥、醫療器材與止血材料。近期推出的 RealSeal 止血粉，在動物實驗中具備極快止血速度、高生物相容性及抗菌潛力，顯示其在創傷急救與醫療應用上的突破性價值。"], ["CX-05", "皓準科技股份有限公司", ""], ["CX-05", "城智科技股份有限公司", "AIRA城智科技是由擁有多年AI影像處理經驗的團隊所組成，專注於AI相關領域的研究與開發。AIRA的使命是採用先進的人臉、人形與物件辨識技術，並整合於影像管理與門禁等系統，開發AI+IOT+Cloud等多種整合性應用方案。於2020年榮獲 Intel Gold Partner 的殊榮，並與NVIDIA, Network Optix, AWS展開深度技術合作。\n。解決方案廣泛應用於企業、智慧建築、工地管理等場域，協助場域提升安全與管理效率。"], ["CX-05", "思微智能股份有限公司", "思微智能在影像與語音AI領域有多年經驗，產品愛腦快篩運用聲紋生物標記達到無侵入、高準確率認知障礙風險評估，可用於失智早期與認知障礙的及早發現，團隊參加2024年INTERSPEECH輕度認知障礙中英雙語AI檢測競賽，獲全台第1、亞洲第2、華語MCI檢測準確率超過90%，MMSE預測亞洲第一"], ["CX-05", "嘉堂資訊有限公司高雄分公司", "嘉堂資訊是您擴展XR應用及優化數位雙生（Digital twin）解決方案的首選沉浸式技術合作夥伴，並為各行各業量身定制解決方案。\n將XR技術整合到智慧製造中，利用AR、VR和MR技術提供直觀、豐富的數位體驗。工人無需實際進入現場即可進行培訓、檢修和維護，減少風險並提高生產效率。XR技術還可模擬不同場景，增強工作效率和安全性。\nXR技術為智慧製造帶來了高效、安全的工作環境，推動了工業革新。"], ["CX-05", "摯陞數位科技有限公司", "摯陞數位致力於SMART\nSHIP之推動，開發SRP(Ship Resource Platform)戰情室。除了具備靈活開發能力，包含海事衛星通訊的部署，滿足所有協定應用開發，並結合最新的AI運算和學習、電腦視覺、邊緣人工智慧和工業物聯網技術整合船端與岸端之資料，達到最大效益。\n我們提供以下三大服務:\n1.船位大數據:利用AIS數據及相關資料，建立船位大數據系統，有效提升船舶管理與效率。\n2.SRP船舶資源管理系統:透過船岸管理及通訊整合，有效率的管理船舶。\n3.SHIP-IoT船舶物聯網解決方案:連結船端的設備、感測器以保有數據監控，讓船上能即時取得協助。"], ["CX-05", "睿田能源股份有限公司", "睿田能源專注於研發與生產創新的可循環彩繪光電應用圖層技術，該技術能有效降低產品製程中的碳足跡，同時提升太陽能板的散熱效能與視覺美觀，積極實踐ESG永續發展目標，推動全球低碳經濟與綠色能源普及。創新淨零循環永續商模，解決太陽能板廢棄與處理問題；我們致力成為全球彩繪光電技術的領導品牌，攜手共創淨零永續的未來，加速永續經濟模式推展，助力全球淨零目標達成！"], ["CX-05", "寵訊生醫股份有限公司", "寵訊生醫（PETcision）成立於2023年，是一家專注於寵物癌症檢測與大數據應用的生技公司，致力於打造亞洲領先的寵物精準醫療平台。團隊融合癌症生物學、基因體分析、臨床獸醫與商業策略等跨領域專業背景，成功與全台超過150家動物醫院建立合作，推動創新癌症篩檢技術落地臨床。 旗艦產品「癌識優」採用液態切片（liquid biopsy）與次世代基因定序（NGS）技術，僅需抽血、無須麻醉或侵入性操作，即可早期偵測多達20種犬隻癌症訊號，具備安全、即時、準確等特性，協助飼主及早掌握毛孩健康狀況，爭取治療黃金期，讓陪伴更長久、更安心。 寵訊生醫亦正建構亞洲首個犬癌症基因資料庫，整合臨床病例與癌症基因數據，未來將應用於新藥靶點開發、保險風險建模與個體化健康管理等多元場景。透過「檢測服務＋資料平台」雙軌策略，寵訊生醫不僅創造即時臨床價值，更打造具長期潛力的產業數據資產，成為推動寵物精準醫療的關鍵驅動者。"], ["CX-05", "沃龍工業股份有限公司", "本公司專注於研發智慧製造解決方案，致力於推動傳統加工製造業邁向數位化與智慧化。我們的AI智慧刀把技術透過高精度感測器與AI演算法，提供即時刀具壽命預測與優化加工參數，大幅提升生產效率，降低成本，並實現環境永續目標。"], ["CX-05", "威捷生物醫學股份有限公司", "威捷生物醫學股份有公司創立於2016年6月，團隊成員分別來自學術、商業、科技資訊以及醫學領域，具備深厚的專業知識與執行力，結合知識管理的專業，從事醫學顯微影像辨識與疾病偵測研發，透過最新研發之自動顯微鏡，可在客戶端取高倍率和高解析度影像，透過雲智慧與大數據分析，進行癌症與疾病的偵測與篩檢，結合出自動化顯微影像辨識系統與雲端伺服器，提升臨床檢驗品質。"]],
    "cx-06": [["CX-06", "赫侖股份有限公司", "赫侖為強整合AI、機器人與感測器的軟體新創，開發HolonOS核心軟體，具備3D視覺掃描路徑生成、製程參數優化與AI程式撰寫功能。支援多品牌機械手臂與感測器，1小時內上手，15分鐘建立加工路徑，3分鐘完成製程優化，協助製造業轉型AI彈性製造，已落地9大產業、13項成功案例。"], ["CX-06", "詠鋐智能股份有限公司", "Chimes AI致力於建置石化、鋼鐵、材料業AI應用模組。將通用模組寫成No-Code平台，供現場操作員使用。我們有頂尖的數學團隊、領域知識專家及IT團隊，解決業界各種痛點，讓User操作上一覽無余"], ["CX-06", "巴涼科技股份有限公司", "CADASU 卡大師 | 革新製造業的工程圖 AI\n\nRemoteNC Inc. 是一家專注於製造業數位轉型的軟體公司。我們的核心產品——工程圖 AI，能自動化解析與管理工程圖，協助企業快速辨識尺寸、公差與加工特徵，並結合歷史報價數據，大幅縮短報價時間、降低錯誤率。\n\n面對少量多樣的製造趨勢，CADASU 以 AI 代理（Agentic AI）為基礎，將設計、報價與生產流程高度整合，讓新手也能具備專業判斷力，讓工廠更快、更準確地響應客戶需求。\n\n我們的使命是重構傳統的設計與製造鏈條，推動製造業的智慧化與全球競爭力。CADASU 期待與更多夥伴攜手，開創未來製造的新標準。"], ["CX-06", "賽諾運算有限公司", "讓 AI 深入邊緣，實現真正的智慧與可適性決策。 工業製造、智慧城市、智慧電網等應用場景不該只依賴雲端，而應具備更靈活、高效的邊緣運算能力，確保即時決策、提升效率並降低成本。因此推動 Edge AI，讓數據能夠在最接近源頭的地方被即時處理，推動智慧應用真正落地。\n\n透過廣域的技術知識融合（Cross-Domain Knowledge Integration），整合人工智慧、自動化控制、工業協議、資訊安全、雲端運算等多領域專業技術，打造適應多場景需求的 Edge AI 解決方案。\n\n不只是開發 AI，更是讓 AI 無縫嵌入邊緣設備，發揮最大價值，驅動企業運營更智慧、高效與可靠。"], ["CX-06", "立特有限公司", "立特科技提供一個全方位的可視化管理系統，涵蓋能源管理（EMS）、設備管理（IoT）、微電網及碳盤查功能。我們的系統具備快速導入、降低成本和提高效率的優勢，為跨國企業乃至上市公司提供解決方案。透過立特科技的系統，企業可以輕鬆實現能源管理、碳盤查與設備管理的一站式需求，大幅提升運營效益與可持續發展能力。"], ["CX-06", "華苓科技股份有限公司", "華苓科技為台灣本土軟體公司，以企業流程管理系統聞名。隨著數位科技發展，華苓在流程管理的基礎上，融合了雲服務、物聯網、行動、社群、AI、區塊鏈、大數據，推出企業競爭力迭代必備的智慧系統，並實現豐富商模。"], ["CX-06", "十論科技股份有限公司", "Tricuss 是個 AI 洞察產生器。我們協助企業將流程、知識和數據與 AI 整合，將企業流程轉型為人類與 AI 協作的新模式，進而由 AI Agents 中獲取決策輔助的洞察和建議措施。"], ["CX-06", "摩絡人工智慧股份有限公司", "公司主要提供以下服務：\n1. AI 智慧製造解決方案：應用新興的機器學習（ML）與深度學習（DL）技術，解決製造業中的核心痛點，並提升關鍵製造績效指標（如品質、製程、機台運行、能耗管理及供應鏈效率）。\n\n2. 智慧製造 LLM 應用：透過大語言模型（LLM）解決人員經驗傳承、產線知識管理、品質客訴、機台操作等問題，並包含 Fine-tuning（微調模型）、RAG（檢索增強生成）等技術，協助系統上線應用，包含地端部署、私有雲部署使用模式。"], ["CX-06", "洞視科技有限公司", "公司由研發技術人才所組成，專注於AI技術驅動產業創新，致力以影像與數據分析服務。\n深耕領域包括 :智慧醫療、農業、能源、工廠製造場域，協助各行各業提供創新(視覺客製化)智能解決方案。"], ["CX-06", "根基智能理財", "綠點碳島 App 是一款把記帳、碳排推估、遊戲化環境教育結合在一起的記帳程式。只要掃描發票，就能自動計算每筆消費的碳排量，還能透過減塑行動等任務綠點碳島App 是一款把記帳、碳排推估、遊戲化環境教育結合在一起的記帳程式。 只要掃描發票，就能自動計算每筆消費的碳排量，還能透過減塑行動等任務賺取「綠點」，用來建設你的專屬虛擬島嶼、復育動物生態。"], ["CX-06", "絢麗光電股份有限公司", "絢麗光電是液晶材料的設計公司，我們專注於客製化的液晶材料與光學設計並且具有軟性薄膜製程平台中可進行小量生產驗證，可應用於透明顯示、電子紙與智慧窗戶等領域。"], ["CX-06", "偲愷動力股份有限公司", "偲愷動力股份有限公司(英文：Sky Dynamics)成立於2024年2月，是台灣首家主打無人機隊網絡運營的新創公司並以「ZHUOEN 卓恩基地」為品牌出發，提供各產業的無人機隊「預約派遣」及「營運管理」服務。我們專注於透過利用數位服務和AI科技，降低企業在無人機營運上的成本及風險，幫助各行業透過無人機技術達到降低成本、提高效率、加速並實現可持續發展目標。"], ["CX-06", "瑪諾斯數位科技股份有限公司", "瑪諾斯數位科技 Mrules 整合「保險、金融、醫療」的跨領域創新公司，專注於打造「財委慧協作平台FInspirit.AI」，提供金融保險產業永續數位轉型方案：多模態互動金融知識庫、 AI Agent需求診斷、虛實整合的直覺式與互動化場景、財務保險規劃書、保單管理檢視以及線上智能簽約系統，建構金融保險醫療知識神經網絡及數據導向的管理支援。協助企業提升管理決策、教育訓練、銷售效率與客戶體驗。我們致力於推動OMO虛實整合，成就綠色、友善、普惠的大眾金融保險生態。"], ["CX-06", "高雄大港創艦新創基地", "大港創艦打造亞灣智慧科技創新產業環境，提供新創團隊「前育成」至「後育成」各階段支援協助，鏈結新創團隊促進產學群聚奏效，亦結合中央科專計畫及民間資源，持續推動5G AIoT等智慧科技創新科技應用及示範案例落地高雄。"], ["CX-06", "高雄金融科技創新園區", "展示方案：AI范建德老師介紹高雄金融科技創新園區\n方案介紹：團隊以范建德老師為人物樣板，導入AI模型製作范老師形象人物，並以螢幕及音響為媒介與現場來賓互動，現場參觀來賓可以向螢幕中的范老師提問、范老師將直接回答現場來賓，在有人經過但無人詢問的方式下、范老師會主動向來參觀的民眾介紹高雄金融科技創新園區、園區規劃發展的八大項、目前進駐的廠商簡介、未來發展願景"], ["CX-06", "高雄市數位內容創意中心(DAKUO)", "面對具有實體銷售、電子商務發展以及企業流程優化等需求的企業客戶，我們提供全面的品牌發展諮詢與策略規劃、智慧商務方案導入與流程效率提升，並協助客戶順利展店或壯大企業核心業務，邁向國際連鎖或全球化企業目標。"]],
    "gp": [["GP3-01", "EvoFlow Technologies", "EvoFlow Technologies is a Russian-registered automation and digital transformation company focused on helping businesses reduce manual work, improve data quality, and automate repetitive operational processes.\n\nWe design and build practical automation solutions for document control, reporting, data consolidation, workflow optimization, and system integration. Our experience is especially strong in EPC, construction, manufacturing, and other data-heavy industries where teams work with large volumes of Excel files, reports, registers, and technical documentation.\n\nOur approach is based on analyzing the client’s existing processes and tools, then creating simple, reliable automation systems that reduce errors, save time, and help teams focus on higher-value work."], ["GP3-02", "IIST", "Physical security. Encryption from a chip - dynamic PUF. Devices can communicate with 100% certainty about identity. Images like from security cameras can be certified as taken by a specific camera and not being tampered with."], ["GP3-03", "Founduz Limited", "Founduz 是一間國際創業人才的媒合平台，連結創辦人、共同創辦人與具備國際創業經驗的高階人才，協助新創團隊建立更強大的合作關係。"], ["GP3-04", "ID7 LLC", "ID7 LLC 為中小企業與各類組織提供實用的軟體、物聯網及資安解決方案。"], ["GP3-05", "A Pro Marketing Inc.", "A-Pro是一個數位行銷工作流程平台，旨在幫助企業提升網路聲量和社群媒體的能見度。A-Pro配備先進的AI驅動工具，提供一系列功能，如文章和社交媒體內容生成、SEO預測指標以及綜合洞察，幫助用戶輕鬆創造優化後的高排名內容。我們量身定制的AI幫助您顯著減少手動內容所需的時間和成本，而我們的機器演算法則提供實時數據分析，幫助您保持行業趨勢的領先地位，並迅速適應不斷變化的數位行銷環境。無論您是小型企業、行銷代理商還是大型行銷部門，A-Pro都為您提供工具，幫助您優化數位行銷策略，並在競爭激烈的數位佈局中取得成功"], ["GP3-06", "達陣實驗室", "達陣實驗室正在建立一套從工作負載、運算系統到製造能力的開放式智慧運算基礎設施。我們協助企業與研究團隊衡量並最佳化真實的人工智慧工作流程，涵蓋模型、API、執行環境、記憶體系統、硬體與部署架構。我們的系統整合託管式推論、工作流程感知路由、私有基準測試、Token 與 KV 快取最佳化、異質運算後端選擇、自建部署分析及合作夥伴後訓練，並以真實工作負載證據引導未來的軟體、記憶體系統、硬體模組、材料研究與可製造基礎設施。"], ["GP3-07", "野旭有限公司", "Omawild 是一個以地球生態修復為核心理念的食品品牌。從我們嚴選的原料，到我們所支持的自然環境，每一項推出的產品都以讓地球變得更美好為目標。我們與實踐再生農業的農民攜手合作，共同開創一個嶄新的未來——讓我們所食用的每一口食物，不只是提供養分，更能積極修復並重建我們賴以生存的生態系統。"], ["GP3-08", "Pawggo", "Pawggo is the compliance operating system for cross-border pet relocation, giving agents purpose-built tools to manage documents, regulatory requirements, and government approvals in one platform. Starting in Singapore, it replaces today's manual, error-prone processes with scalable infrastructure built for every market."], ["GP3-09", "音易有限公司", "Taption 是一家總部位於美國的 AI 技術公司，成立於 2020 年，專注於開發線上自動轉錄與翻譯平台。其核心產品為一款支援超過 40 種語言的 AI 驅動軟體，能夠將音訊與影片內容轉換為精準、時間標記的文字稿，並自動生成字幕與翻譯，廣泛應用於媒體、教育、企業與政府機構等多元場景。"], ["GP3-10", "縱藝科技", "Zonic 致力於打造專業影片後期製作的智慧操作層。定位於原始素材與初剪成片之間，Zonic 透過人工智慧理解素材內容、挑選合適片段並自動組裝時間軸，直接輸出至業界標準剪輯軟體。\n\nZonic 的核心技術，是以業界少見規模的真實商業製作專案檔案資料庫訓練而成，紀錄專業剪輯師實際的剪輯決策，而非人工合成資料。這種學習而來的剪輯判斷力，正是 Zonic 與一般人工智慧剪輯工具的根本差異。\n\n台灣是 Zonic 的關鍵市場。Zonic 已在台灣完成子公司登記，並與當地影視製作公司直接合作,取得真實專案素材與剪輯回饋，持續強化人工智慧對專業剪輯的理解。這樣的合作讓 Zonic 得以在實際商業製作中測試並導入技術，與台灣影視產業建立長期共榮的夥伴關係。\n\nZonic 的願景，是成為影片製作不可或缺的人工智慧基礎設施層，服務範圍將從中小型製作團隊擴展至電視台與串流平台，並延伸至次世代裝置的人工智慧影像擷取應用。"], ["GP3-11", "糖黐豆機械人有限公司", "Bonbon Robotics Ltd一家香港本地機械人研發及服務應用公司。從起始以STEAM教學機械人為目的，轉型到以二次開發機械人服務(Secondary ROS Development)，以及開發地下管道機械人的專項領域。Bonbon Robotics Ltd 一直秉承「工匠造物」創新及「以人為本」精神，致力於本地機械人領域應用以及專注於本地服務機械人教學。"], ["GP3-12", "AMDC Holding Limited", "DROP System是一個以區塊鏈創建的積分獎賞平台，透過貨幣化及「先購買後回贈」機制使積分與平台商戶共享，達至互通效果。令顧客可於參與商戶賺取積分並自由地兌換心儀獎賞，增加獎賞吸引力協助商戶保留及增加顧客。平台在區塊鏈上創建積分獎賞計劃，去中心化的本質為商家解鎖新的營銷商機，並孕育誇業務界別合作。對於用家，DROP System會成為他們的一站式平台，集合所有不同的積分計劃，方便有效管理之餘，獎賞分數變得更靈活有彈性。"], ["GP3-13", "卡路思有限公司", "KALOS 是新一代音樂家的成長及營運平台，致力於為音樂家提供指導、工具和資源，幫助他們成為創意企業家，實現成長並掌握自己的未來。我們的主要產品及服務包括：\n\n創意企業家培訓：幫助音樂家掌握商業技能，提升其在音樂產業中的競爭力。\n演藝訓練：提供專業的表演技巧訓練，增強音樂家的舞台表現。\n經理人及推廣服務：支持音樂家在市場上的推廣與品牌建設。\n媒合服務：為音樂家提供合作機會，促進業內網絡的建立。\n網上商城：通過線上教學、視頻課程、授權、演出和商品拓展，幫助音樂家實現多元收入。\n在 KALOS 上，音樂家可以隨時隨地展示和更新自己的履歷、作品和動向，並自主推廣活動、課程和服務。所有操作，包括排程、預訂、付款和溝通，都可以在一個儀表板上輕鬆管理，讓工作流程更加高效便捷。"], ["GP3-14", "ESSAA Limited", "Creato Academy 為中學及大學教育機構提供創意與科技課程。我們致力於為年輕一代提供成功進入創作者經濟所需的技能與知識。"], ["GP3-15", "去比星有限公司", "我們是一家機器人公司，「Second Space」 是我們在高雄為創作者們設立的 24/7 全天候營業共同工作空間，這個空間有我們的秘密 AI 機器人咖啡師為您服務 🤫\n\nSecond Space 是專門為工程師、設計師，以及科技企業家所設計的會員制空間，致力於推廣雙語活動、課程和社群交流。不論是為了創造獨角獸企業使用Pytorch或精進Figma能力，我們提供一處適合學習、工作及放鬆的好去處。\n\nSecond Space 採用會員邀請制且名額有限- 如此，我們確保來這裡的人都如你一樣擁有相同調性。這裡擁有舒適的氛圍及潮流新科技。"], ["GP3-16", "Next Integral", "NEXUO 是由將來積分有限公司開發的邊緣人工智慧視覺辨識平台，專注於工業檢測、安全監控、製程驗證與人流分析。系統可部署於 NVIDIA Jetson 等邊緣運算裝置，無需依賴雲端，協助製造業與工業現場即時進行視覺品管與安全合規。公司於 2024 年成立，創辦人擁有法國巴黎綜合理工學院博士學位，並具備 15 年以上橫跨航太無損檢測、醫療影像與 CNC 系統的工業 AI 經驗。目前業務拓展遍及歐洲、韓國與東南亞，並曾獲 IFA 2026 Top 10、VivaTech 2026 Top 30、CES 2026 Top 50 等國際獎項肯定。"], ["GP3-17", "之間國際有限公司", "XRIO 致力於為會展（MICE）及餐飲旅宿（HORECA）產業提供永續循環材料與服務，協助企業減少廢棄物，實現資源循環。"], ["GP3-18", "睿德菲爾有限公司", "睿德菲爾有限公司是一家進駐亞灣新創園的高雄 AI 深科技新創。旗下 Replay Engine 擷取車隊歷史營運資料，重建基準並計算反事實路線優化，技術建構於 OR-Tools、OSRM 與 OpenStreetMap。目標為 25 至 200 輛的中型物流車隊。工作語言為中英文。"], ["GP3-19", "移定好國際股份有限公司", "我們是一個雙語租屋平台，協助本地居民及國際人士在台灣尋找並租賃合適的房屋。我們與房仲業者及物業管理公司合作，透過多語言工具、線上預約功能及高效率的溝通流程，提供現代化、科技驅動的租屋體驗。我們的使命是讓租屋流程更簡單、更便利，同時協助房地產專業人士透過更有效率的數位平台接觸更廣大的客群。"], ["GP3-20", "策藝股份有限公司", "I Creation 策藝相信，藝術不僅是文化的表達，更是商業溝通最有力的語言。我們的願景是打造一個讓表演藝術與品牌世界深度融合的生態系統。\n我們的使命是透過策略性的藝術策劃，幫助企業深化品牌文化、協助藝術家建立可持續的職涯，並為藝術教育機構開拓通往產業的橋樑。\n\n\n我們相信每一個創意都需要紮實的策略基礎。在執行前，我們深入分析目標、受眾與市場環境，確保每個決策都有明確的商業邏輯。"], ["GP3-21", "亞曼科國際有限公司", "ARMCo Lab 開發了 FanID——一個適用於可快速掃臉驗證入場在大型活動、音樂會、遊樂園和確保掃臉支付安全的 Apple ID。我們的系統改善了龐大流量場所的通行速度，數位和實體零售掃臉支付安全等問題。我們以保護個人隱私為優先，基於零知識加密專利的臉部驗證解決方案，適用於活動快速入場和掃臉支付安全，提升各行業的用戶體驗。這些類似的技術已應用在世界各國，例如: 零售速食店、大阪世博會等大型活動中蓬勃發展。"], ["GP3-22", "3DPRINTTEK PTE. LTD", "利用3D concrete printing(3DCP)與Physical AI的Construction as a Service(CaaS)平台"], ["GP3-23", "Overhaul Pte. Ltd.", "Buildables 為關鍵行業（如製造、國防、汽車、石化等）的機械工程師構建機械工程模型，助力團隊將運營速度提升 10 倍，並將運營成本平均降低 3 倍。"], ["GP3-24", "以力股份有限公司", "以力科技於2018年成立，以成為地方與科技的橋樑為使命。公司主力產品MantaGO是一個革新性的對話式商務平台，運用生成式AI技術，為企業打造智能化品牌服務體驗。作為亞洲首創整合五大社群平台（LINE、Messenger、Instagram、WhatsApp和Live Chat）的解決方案，透過簡單直觀的操作介面，讓企業能像製作PPT般輕鬆建立AI客服機器人。平台提供多元化功能，包括AI對話模型訓練、精準行銷、預約服務及問卷調查系統等。"], ["GP3-25", "Dwnrt Absrd Pte Ltd", "We're building at the intersection of generative AI and symbolic world models. Our flagship product SupaSim is an agentic harness that combines organizational knowledge, causal modelling, and simulation to build testable digital twins of strategic decisions."], ["GP3-26", "BalticTaiwan OÜ", "我們是在愛沙尼亞成立的公司BalticTaiwan OÜ，協助台灣企業前往愛沙尼亞成立公司的諮詢"], ["GP3-27", "Taigi AI Labs 合同会社", "Taigi AI Labs 是一家來自日本、專注於台語 AI 的新創公司。我們提供台語語音合成（TTS）、語音辨識（STT）、台語／華語翻譯、語言判定（LID）與 API 串接服務，協助企業、教育機構、醫療照護、公共服務與內容產業，將台語能力導入實際業務流程。\n\n常見應用包含客服應對、接待服務、字幕製作、內容製作、高齡照護、無障礙服務與既有系統整合。我們可從小規模 PoC 開始，依照客戶的資料形式、使用情境與營運需求，逐步設計可落地的台語 AI 解決方案。"], ["GP3-28", "Advance Composite", "A Japan-based deep-tech materials company developing next-generation solutions for AI, semiconductor, and energy industries. Winner of IVS2025 LAUNCHPAD, one of Japan’s largest startup pitch competitions, and recognized by leading industrial and strategic investors."], ["GP3-29", "CREATORSJAM 股份有限公司", "我們提供多元化的影音製作服務，包括企業形象宣傳影片、產品介紹影片，以及活動紀錄影片等，滿足不同客戶的需求。我們提供從企劃、拍攝到後製剪輯的一站式服務，協助客戶透過高品質的影像，有效傳達品牌價值與核心訊息。"], ["GP3-30", "CHOSEN Digital Co.,Ltd.", "電動汽車普及、人工智能和數據中心發展日新月異，但能源基礎設施尚未做好準備。\n\nCHOSEN 的人工智能驅動型能源聚合和虛擬電廠平臺連接電動汽車充電樁、變壓器、建築物和分布式能源資產，優化建築物到電網的電力使用，從而降低高達 75% 的能源負荷和成本，並提高電網靈活性，促進清潔能源的發展。\n\nCHOSEN 曾榮獲多項創業大賽的泰國冠軍、東盟冠軍和全球冠軍。"], ["GP3-31", "Talenthero", "TalentHero is a Singapore-based Employer of Record (EOR) platform that helps companies build and manage offshore teams in Southeast Asia without setting up local entities. We handle recruitment, payroll, compliance, and HR while clients retain full control over their talent."]],
    "cx-02": [["CX-02", "先進 GaN 驅動與 AI 運動控制團隊（工研院電子與光電系統研究所）", "整合 GaN 功率級、FOC 控制與 AI 調校技術，打造機器人關節與致動器高效驅動及控制平台，具高功率密度、低熱損與快速導入優勢，已完成國內首套 GaN 農機驅動器實場驗證，並拓展機器人應用驗證。"], ["CX-02", "格雷迪奧股份有限公司", "格雷迪奧致力於開發兼顧檢疫、品質與永續的農業方案，以全球首創「不造成作物藥傷AIoT永續燻蒸系統」為核心，實現免拆箱燻蒸，獲多國專利，並以台灣輸澳蝴蝶蘭85%市占率、100%通關率布局全球市場。"], ["CX-02", "愛國者綠能科技股份有限公司", "PGET 固態電池突破續航與安全痛點，獨家技術實現高能量、高安全性且零漏液，電池壽命更大幅提升 32%！方案兼具優異性能與易量產優勢，已深耕無人機領域並積極擴展合作，提供廠商最具競爭力的關鍵能源技術。"], ["CX-02", "國立臺灣海洋大學衍生新創企業---鼎豐智造科技股份有限公司", "整合CAE模流分析、金屬3D列印與智慧模具設計，開發壓鑄模具最佳化冷卻技術。透過隨型冷卻水路及熱流分析，提升鑄件品質、降低缺陷率、縮短開發時程，協助產業推動智慧製造、節能減碳與高值化應用。"], ["CX-02", "歐美科技股份有限公司", "源自工研院專利的SNAIT技術，搭配自有演算法可量測深寬比逾30的TSV並檢測缺陷。新型穿透式光學系統滿足玻璃基板TGV 3D量測，涵蓋雷射改質、蝕刻孔與側壁粗糙度，提供D2DB分析協助提升良率。2024獲評為APAC頂尖半導體檢測解決方案供應商。"], ["CX-02", "璞克斯能源股份有限公司", "POXA 綠電售電管理平台可產生 15 分鐘級負載與分析導入離岸風電、彈性分配效益，支援契約管理與多年期採購，把 Excel 升級為可模擬、可最佳化、可監控的雲端決策，已獲國內前十大售電業採用。"], ["CX-02", "築智科技股份有限公司", "• 技術創新： AI讀取設計圖自動生成製造圖，蓋房子像拚積木般簡單\n• 競爭優勢：VLM垂直AI讀圖整合預鑄智慧工廠資訊流\n• 重要事蹟：2026創業綻放大聯盟前30 強、Berkeley SkyDeck IPP B'22"], ["CX-02", "台連得半導體技術股份有限公司", "AI 需求帶動先進封裝 TSV 成長，但其中矽中介層所用 DRIE 製程貴、低產率，又有管壁缺陷。本團隊研發電化學蝕刻技術打造平滑側壁，解決後續製程痛點，兼具技術領先與設備低成本優勢。"], ["CX-02", "宇霆科技股份有限公司", "宇霆科技由國立成功大學研發團隊創立，憑藉三十多年深厚的壓電技術底蘊，累積多項獎項肯定與技術里程碑。公司專注於新一代壓電感測器的創新研發，推出多款領先業界的高性能產品，作為 AI 智慧系統的關鍵感測元件，賦予設備/機械擁有「預測未來」的能力，在故障發生前即可精準預判風險並啟動預測性維護與智慧決策，成為各式智慧化系統中的關鍵核心部件。\n宇霆科技同時提供高度客製化的整合解決方案，涵蓋從材料研發、感測器設計到產品測試的全流程服務，透過自有核心技術與完整研發能量，攜手多元產業客戶打造新一代智慧化產品，突破規格與成本限制，形塑兼具市場競爭力、產品差異化與 AI 應用價值的專屬感測方案。"], ["CX-02", "磐石智慧科技股份有限公司", "磐石智慧科技股份有限公司成立於2024年，是專注於智慧製造AI系統與邊緣運算解決方案的新創科技公司。\n\n核心技術涵蓋影像AI演算法、FPGA硬體加速、工業數據整合與即時預警系統，服務對象涵蓋PCB與半導體設備製造業，協助客戶打造高效、安全且智慧的生產環境。\n\n我們與工業電腦領導廠商研華股份有限公司建立策略合作關係，共同開發整合型AI解決方案，廣泛應用於晶圓製程、智慧工廠、自動化產線與數位戰情中心。\n\n磐石深受國內外頂尖設備商信賴，客戶包含日本高階雷射曝光機設備商、法國雷射曝光機設備商、以色列Wafer製程AOI廠商與台灣尖端科技設備商。"], ["CX-02", "蔚流生物科技股份有限公司", "MedSelect 腫瘤微環境晶片平台 :解決腫瘤微環境與免疫反應不一致問題，提供體外精準模擬平台，協助研發者快速評估免疫療法與個人化藥物效力，縮短開發時間、省成本，提升療效可信度。核心為微流控與三維共培養晶片技術，能再現腫瘤、免疫、血管等多細胞互動；獨家系統整合即時影像分析，支援中通量篩選"], ["CX-02", "工業技術研究院", "工業技術研究院是國際級的應用研究機構，擁有六千五百位尖兵，以科技研發，帶動產業發展，創造經濟價值，增進社會福祉為任務。自1973年成立以來，率先投入積體電路的研發，並孕育新興科技產業；累積超過三萬件專利，並新創及育成，包括台積電、聯電、台灣光罩、晶元光電、盟立自動化、台生材等上市櫃公司，帶動一波波產業發展。"], ["CX-02", "自行車暨健康科技工業研究發展中心", ""], ["CX-02", "金屬工業研究發展中心", ""], ["CX-02", "石材暨資源產業研究發展中心", "用於生物資源之綠色萃取系統，整合超臨界二氧化碳綠色萃取、超音波強化、AI智慧製程控制及LC-MS/MS、GC-MS/MS高階分析，建構涵蓋原料篩選、成分解析、製程優化與功能驗證的一站式技術平台。透過智慧化製程與品質分析，可縮短產品開發時程、降低研發成本，協助業者快速開發高值化產品，推動天然物萃取產業朝綠色製造與智慧化發展。"], ["CX-02", "食品工業發展研究所", ""], ["CX-02", "財團法人船舶暨海洋產業研發中心", "船舶中心以促進臺灣海洋經濟發展，追求技術卓越立足臺灣、放眼亞洲邁向世界市場、整合分享墊高產業基礎、貢獻國家海洋經濟發展為重要任務，持續精進「先進船舶技術」。現階段並配合國家政策，積極參與國艦國造的行列，透過國防自主，整合產業能量，帶動國家整體發展。此外，本中心亦朝向「運輸與遊憩」和「海洋能源工程」等新興海洋產業技術領域邁向，力求推進我國海洋產業發展，並形塑MIT（Made In Taiwan）品質、發展差異化競爭力、建立自主創新與前瞻技術開發能力，帶動關連產業與就業之發展，實現服務國家、服務船舶與海洋產業的設立初衷。"], ["CX-02", "財團法人資訊工業策進會", "生物水質感測數位雙生技術以淡水蜆作為水質污染生物指標，透過AI影像辨識監測蜆殼開合變化；當水質異常時，蜆殼會快速閉合，可即時發出污染預警。系統導入零樣本學習，快速建立辨識模型，具備反應迅速、準確、成本低及易維護等優勢。設備與生物感測來源皆為國產，可降低維修待料風險，適用於民生用水與環境水質監測。"], ["CX-02", "精密機械研究發展中心", "軸心冷卻內藏式主軸，本技術採用旋轉軸心直冷設計，冷卻液直達主軸核心熱源，有效抑制熱形變，於75%最高轉速下僅需3分鐘即可完成暖機，並降低軸承溫度、延長主軸壽命。具備高速、高精度、低速大扭矩及自動鬆拉刀功能，可廣泛應用於加工中心機、精密模具、電動車及航太零組件加工，提升加工效率與品質。"], ["CX-02", "財團法人鞋類暨運動休閒科技研發中心", "將生活科技快速商品化的研發中心"], ["CX-02", "印刷創新科技研究發展中心", "混紡織物光譜影像AI演算辨析，本技術結合高光譜影像、顯微影像與AI深度學習，建構非接觸、非破壞式智慧檢測系統，可快速辨識紡織材料混紡比例與紗線捻法，辨識準確率分別達95.86%及97.76%。相較傳統檢測，可降低30～70%人力與耗材成本，提升3～10倍檢測效率，適用於紡織、印刷、材料檢測及智慧製造等產業，協助提升品質管理與生產效率。"]],
    "cx-03": [["CX-03", "唱歌集音樂劇場", "唱歌集長期於高雄耕耘音樂劇製作演出，自2009年成團起，每年皆推出一部音樂劇作品，至近年票房與口碑兼具的《以為是BL結果是BFF》、《今晚，我想來點》、《大家都想做音樂劇！》等作，是一個熱愛、專長、深耕音樂劇的劇團，自2023年起，為國家文化藝術基金會「演藝團隊年度獎助專案」團隊，2025年更獲「Taiwan Top年度最佳團隊」殊榮；作品《今晚，我想來點》獲第二屆臺北戲劇獎「最佳音樂劇類男主角」。\n\n唱歌集以製作創作雙導向，演出製作的每部作品，除了在音樂上力求風格創新、類型的變化與豐富外，更期望呈現映照出台灣風情、與社會產生對話、能帶給觀眾能量與感動的故事。"], ["CX-03", "遙空映畫有限公司", "遙空映畫專精於企業形象影片、產品廣告、劇情廣告、公部門影片製作，自 2019 年成立以來，已協助超過50間上市公司、300間以上企業、單位，透過影像包裝呈現公司規模、製程實力、產品價值與企業文化。\n我們尤其擅長服務B2B企業，能理解製造業、科技業與工廠類型的企業在對外溝通上的需求。從企劃腳本、拍攝執行到後期剪輯，我們提供完整且具策略性的影像製作服務。\n對我們來說，企業形象影片拍得好看已是必備條件，更重要的是能被實際運用，協助企業在官網、業務簡報、參展展示、海外開發與人才招募等場景中，真正提升信任感、轉化率與溝通效率。\n同時我們也提供影視器材租賃服務，透過器材支持的方式已協助超過上百組同行完成拍攝，因器材數量的優勢也能印證我們能提供最穩定且優質的品質。"], ["CX-03", "合劑數位感應有限公司", "我們是「合劑數位（SDDS FILM）」，致力於將「上百人的CG工廠流水線，壓縮成 10 人以下的自動化生產線」。\n我們透過自研的 Houdini -> OpenUSD -> Unreal 自動化流程，最快可以在「數天內」完成高品質的內容。作為國際組織 AOUSD（OpenUSD 聯盟）的貢獻成員，我們打造的頂規 3D 數位資產具備「做一次，到處用」的通用性，專攻不向低階設備妥協的高端視覺市場。\n\n了解更多請至：https://sddsfilm.com/projects/the-artist-s-imaginarium-lanzarote"], ["CX-03", "滯留島舞蹈劇場", "滯留島舞蹈劇場以障礙藝術與當代舞蹈為核心，長期發展共融創作、國際共製、教育推廣與企業合作，透過展演、工作坊與講座，推動身體多樣性與文化平權。"], ["CX-03", "謙謙創藝國際有限公司", "好想兔（Very Miss Rabbit）為台灣原創角色品牌，自 2016 年創立以來深受粉絲喜愛。品牌以可愛療癒的外表，結合貼近生活的社畜日常與情侶互動小劇場，至今已於台灣地區 LINE 官方貼圖平台連續 7 年蟬聯貼圖銷售冠軍，累積銷售超過數千萬組貼圖。\n品牌背後由 謙謙創藝國際有限公司 全面營運，團隊擁有涵蓋「設計、行銷、經紀、營運」四大核心部門的完整創意體系，專注於品牌策略、視覺設計、活動推廣、IP經營與商業合作。\n好想兔擁有豐富的品牌授權與異業合作經驗，合作對象包含：7-ELEVEN、全家便利商店、康是美、甜蜜約定、丸龜製麵等知名品牌，顯示出其在 B2B 合作與消費者市場中皆具備高度影響力與認知度。\n此外，團隊亦積極舉辦快閃店、大型實體展覽與粉絲活動（如2024年好想兔中秋特展、2025年好想兔新年特展....等等），持續累積品牌曝光與社群討論熱度。"], ["CX-03", "奧義品牌國際有限公司", "AOYI 的logo設計是以四隻鳥的意象做勾勒，中間代表的是一個蛋的形象，期許我們在授權領域方面，能成為一個孵育的基地。\n奧義AOYI的基礎精神是創造「無限可能」，無論從深度、長度、寬度，將想像不受條件拘束地發揮無限創意，為商品注入正能量，加值品牌生命力。\n圖像是無國界的語言，擁有在地故事與精神的圖像品牌，能迸發出更大的文化力量，傳揚更多寓意深遠的故事。奧義國際孵育品牌自有個性，達到高度的可塑性與記憶度，並讓圖像具有更多的想像。"], ["CX-03", "小虎日工作室", "提供圖像授權、商品設計、展場設計"], ["CX-03", "淺動藝文有限公司", "淺動藝文有限公司（Micromovement Co., Ltd.） 致力於串連音樂、創作與教育，透過音樂製作、演出企劃、藝文策展及教育推廣，打造兼具創作能量與國際視野的文化平台。"]],
    "cx-04": [["CX-04", "證券櫃檯買賣中心", "創櫃板提供具創新、創意構想之非公開發行中小微型企業「籌資」、「輔導」及「媒合」功能，扶植其成長茁壯。櫃買中心特別邀請創櫃板之夥伴於現場進行成果展示，分享創業的經驗與如何有效運用櫃買中心的資源，讓企業發光發熱。"]],
    "ep-01": [["EP-01", "中華開發創新加速器", "中華開發創新加速器（CDIB Capital Innovation Accelerator, CCIA）隸屬於台灣最大的創投公司中華開發資本，擁有豐富的基金投資與管理經驗。2023 年 3 月，CCIA 於日本東京市谷成立 CDIB Tokyo Innovation Hub，作為串聯日本與台灣新創生態圈的重要平台。2024 年 8 月，CCIA 攜手日本政府基金 Cool Japan Fund、台灣國家發展基金以及產業策略投資人，共同成立 CDIB Cross Border Innovation Fund（CCBI），致力於推動台日跨境創新與投資合作。此外，2025 年 6 月，CCIA 進一步於日本福岡天神設立辦公室，持續拓展在日本的據點與合作網絡，深化對日本新創生態系的投入與支持。"]],
    "ep-03": [["EP-03", "極智移動 Lean Mobility", "Lean Mobility首款都市微型電動車「Lean3」採用前雙輪轉向、後單輪驅動的三輪配置，車身僅為小客車的 1/3，車身長 2,470mm、寬 970mm，屬於都市最小級 EV。憑藉獨家「主動式車身傾角控制技術」（Active Lean Technology），使車體在過彎或顛簸路面時，能自動調整前輪左右懸吊，使車身傾斜到最佳角度，確保穩定行駛並帶來舒適的駕乘體驗。此外， Lean3 配備防雨、防風的車廂及車內空調，續航里程達 100 公里，大幅改善傳統小型 EV 的不足。"]],
    "t": [["T3-01", "山中蜜境 蜂蜜飲品", "我們來自嘉義梅山的梅美養蜂場，至今已有50多年的養蜂經驗，2023年再度榮獲農業部國產蜂蜜評鑑「頭等獎」，隨著第二代青年返鄉創立「山中蜜境」品牌，除了原有小農生產的純天然蜂蜜外，更推出使用自家蜂蜜製作的飲料、甜點，希望讓更多民眾享受甜食帶來的幸福滋味，也能兼顧安心與健康。"], ["T3-02", "翔鶴佳生技", "翔鶴佳生技成立於 2018 年，紮根高雄，專注於天貝（Tempeh）發酵。品牌核心是一株分離自旗山香蕉葉的原生 Rhizopus microsporus 菌株，與工業技術研究院（ITRI）共同研發，取得發明專利 TWI805159B。這株在地菌天生適應台灣風土，帶來穩定純淨的風味與營養。\n我們採用 15 種豆類與穀物共同發酵，讓天貝擁有更完整的胺基酸、膳食纖維與植物營養，從傳統發酵食品升級為現代機能食物。產品通過日本 VegeProject 純素認證與 SGS 食品安全檢驗，並與多所大學產學合作研究。\n產品線涵蓋生鮮天貝、天貝香鬆、堅果棒、植萃奶，已行銷日本與加拿大有機通路。翔鶴佳，從一株菌開始，發酵台灣的健康未來。"], ["T3-03", "剛好樂群", "從岡山樂群村出發，剛好樂群重新詮釋「文化聚落」的樣貌。\n以餐飲與物產選品，串聯眷村記憶與生活滋味。。\n我們想建立一處安心休憩、自在相遇的空間，是岡山與來訪者共享的理想生活場景。 \n這裡屬於岡山，更是歡迎世界抵達的文化門戶。\""], ["T3-04", "小田吃光手工辣椒醬", "選用老爸退休栽種的朝天椒\n由女兒創立的辣椒品牌\n起因是因為女兒剛結束北漂\n\n回老家小田幫忙採盛產期過多的辣椒\n從不下廚原先也不吃辣的女兒\n萌生出「那來炒辣椒醬好了」的念頭\n誤打誤撞開啟了辣椒醬人生。\n\n小田採用有機酵素栽種\n自產自銷、純手工製作\n不添加化學物料與防腐劑\n栽種一種單純的作物\n創造一瓶家鄉的味道\n\n「小田吃光」希望客人把小田裡的辣椒\n做出來的辣椒產品，通通吃光光"], ["T3-05", "島島永續柑仔店", "【島島永續柑仔店】一間賣永續的店。Sustainashop, A store that sells sustainable products only.\n以城鄉永續發展為核心，致力將偏鄉離島的永續解方帶入城市生活。以海洋、土地、山林為場域，透過綠色商品、循環再用、永續行動三大主題，結合地方故事、永續選品、行動教育，打造具影響力的永續共學平台。以主題策展推廣知識、精選永續商品、體驗教育，讓永續概念成為生活新潮流。"], ["T3-06", "果食男子", "果食男子 —— 榮獲英國世界柑橘果醬大賽【 雙金大獎 】、日本及澳洲金獎的臺灣果醬品牌。創業十年，專注於將臺灣各地特色水果透過細膩的手工製作，封存成一罐罐果醬，並揉合地酒、香料、香草、蜂蜜等搭配，希望透過四季風土滋味，讓臺灣島嶼美好的果物走入每個人的餐桌生活裡。"], ["T3-07", "漓咖啡", "漓咖啡（Li Coffee）源自高雄桃源區，由返鄉青年夫妻共同創立，致力於推廣桃源精品咖啡與山村文化。我們從咖啡種植、採收、後製、烘焙到沖煮，全程投入，將高山風土孕育出的獨特風味呈現在每一杯咖啡中。桃源區海拔高、日夜溫差大，造就咖啡甜感明亮、口感甘潤且層次豐富的特色。\n\n除了咖啡產業經營，漓咖啡也積極串聯地方文化、歷史建築與社區行動，於六龜百年歷史建築洪稇源設立據點，透過咖啡、導覽、體驗活動及在地產品推廣，讓更多人認識桃源與六龜的人文故事。我們相信，一杯咖啡不只是飲品，更是連結土地、文化與人的橋梁，期望以咖啡為媒介，讓更多人看見高雄山城的美好與價值。"], ["T3-08", "日漬", "日漬，取自「日子」，也取「漬」之意。\n我們相信，四季更迭孕育不同的風味，而真正動人的滋味，來自時間的浸潤與細心的等待。每一顆果實、每一份收成都承載著土地的氣息，在慢慢釀製、醃漬與保存的過程中，將季節封存，也將生活的溫度留存。\n來自高雄桃源復興部落，日漬以在地農作物為起點，將水果與作物製成果醬、果乾、果醋，再延伸成一口口手作點心，讓山林的恩賜以不同的樣貌走進日常。\n我們希望分享的不只是食物，而是一種與土地共好的生活方式。願日漬陪伴每一個平凡卻珍貴的日子，讓四季的風味，在你的日常裡緩緩發酵。"], ["T3-09", "好愛雞生技有限公司", "好愛雞生技有限公司致力於打造透明、安全且永續的雞蛋供應模式。我們採用友善放牧飼養，提供母雞更自在的生活環境，全程不使用抗生素及動物性蛋白飼料。我們除了提供家庭訂閱配送，更與餐飲品牌、企業及食品加工廠合作，透過契約養殖降低蛋價波動風險，建立穩定供應鏈。我們相信，每一顆雞蛋都不只是食品，更代表生產者對品質、動物福利與食品安全的承諾，希望讓消費者吃得安心，也讓台灣蛋雞產業走向更永續的未來。"], ["T3-10", "蘭園小天使義式冰淇淋", "我們用一口冰品，說一個關於土地與四季的故事。\n「蘭園小天使」選用台灣在地小農的時令果物，研發出一系列無添加、純天然的創意冰淇淋與果物甜品。\n從木瓜、小米酒、可可到香草與紅龍果，我們以風土為靈感，將農產化作沁涼風味的日常驚喜。"], ["T3-11", "蝶svongvong烘焙坊", "蝶SVONGVONG烘焙坊位於高雄茂林山區，是一間來自部落的天然酵母烘焙坊。我們堅持使用天然酸種酵母慢發酵，結合茂林紅藜與在地特色食材，將魯凱文化、山林風味與職人精神揉進每一顆麵包。雖然身處偏遠山區，我們仍透過餐車、市集與外送服務，把來自山林的溫暖帶進城市。希望每一位品嚐蝶烘焙麵包的人，不只是吃到健康與美味，更能感受茂林土地的故事、原住民文化的溫度，以及我們對烘焙最真誠的堅持。"], ["T3-12", "山清有魚", "「山清有魚」創立於2025年初春，來自高雄六龜這座靜謐的小山城。\n我們的【六龜山茶醬油】以台灣在地黑豆為基底，結合六龜原生種喬木山茶的清香雅韻，\n無添加人工食品添加物，依循傳統古法釀造工藝，將品質、風味留住，造就風味獨特、濃郁卻不厚重、回甘細緻的純釀醬油。\n「山清有魚」從山裡出發，邀您一同品味山林的純淨，感受土地的溫度，讓家的味道延伸到更多人的餐桌上～"], ["T3-13", "Moon&Deer月鹿小徑巧克力", "月鹿小徑 Moon Deer Cacao以友善栽培方式孕育出台灣風味的可可豆。我們堅持單一莊園、小批次處理，只為保留最純粹的黑巧風土。每一顆可可豆，都歷經雙手發酵、烘焙、細磨成型，轉化為如手沖咖啡般自然層次的黑巧克力\n\n我們與屏東、高雄、南投的可可小農合作，採用友善栽培的台灣可可豆，堅持單一莊園、小批次處理，保留黑巧克力專屬於產區的風味特質，打造莊園級黑巧克力的高品質。從發酵、烘焙到成型，全程細緻手工製作，呈現如精品咖啡般的自然層次與香氣。\n\n品牌致力於永續理念，採用無塑再生紙包裝，並與在地印刷職人合作，傳遞自然與人文共生的價值。\nMoon Deer 巧克力作品在ICA與AOC英國皇家巧克力大賽中累積榮獲十多項獎項。"], ["T3-14", "愛浪客｜毛孩良食｜販亮店", "愛浪客｜毛孩良食\n\n「每一口，都承載著對毛孩與土地的溫柔。」\n\n相信，真正好的食物，不只是美味，更應該來自對生命、土地與永續的尊重。\n\n我們嚴選 台灣在地優質肉品，攜手台灣友善農場，並融合日本 かじゅのうか（Kaju no Oka） 對天然食材的職人精神，以最純粹的方式，保留食物原始的營養與風味，讓毛孩吃得安心，也吃得幸福。\n\n⸻\n\n✦ 職人製程｜鎖住天然鮮味\n\n採用 獨家低溫烘乾 × 凍乾技術，完整保留食材的營養、色澤、香氣與口感，不添加多餘調味，讓每一口都是來自食材最真實的風味。\n\n✦ 安心品質｜每一份都值得信任\n\n合作工廠通過 ISO 22000 與 HACCP 食品安全管理系統，從原料、生產到包裝層層把關，只為守護每一位毛孩的健康與安心。\n\n✦ 永續理念｜支持台灣在地\n\n堅持選用 台灣在地肉品與農場食材，支持本土農業與永續循環，降低食物里程，讓每一份毛孩零食，都能成為支持土地的一份力量。\n\n✦ 公益同行｜讓愛延續\n\n我們承諾 提撥 10% 品牌盈餘，投入流浪犬貓的餐食、醫療與救援行動，因為我們相信，真正的美好，不只存在於家中的毛孩，也應該延續到每一位等待被愛的生命。"], ["T3-15", "隆正食業", "隆正食業致力於打造兼具美味、品質與創意的高雄在地伴手禮品牌，以嚴選天然食材及職人製程，推出深受消費者喜愛的「法式巧克力橙片」及「法式鵝油系列」商品，將法式工藝與台灣在地風味完美融合。品牌榮獲交通部觀光署觀光圈大賞南區伴手禮銀牌肯定，堅持無過度添加、講究食材原味，讓每一份產品都能傳遞幸福與溫度。此次將帶來最具代表性的伴手禮，無論送禮、自用或品味分享，都能感受來自台灣高雄的職人精神與精緻美味，邀請大家一起品嚐隆正食業的用心與感動。"], ["T3-16", "沐慕有朝", "「沐慕有朝」以大地饋贈的花草為核心，將自然的芳香靈魂帶入現代生活。\n\n我們認為花草不應只是點綴，更是味蕾的深度體驗。品牌以不含咖啡因的花草茶為基底，無論何時大人小孩都可以安心享受純粹芬芳。同時，我們突破飲品的框架，持續探索花草的無限可能，將自然元素揉入各式小食中。\n\n透過對花草層次感的堆疊與不斷創新的實踐，「沐慕有朝」期待以更溫潤的方式，帶領大眾重新定義花草在餐桌上的角色，共同品味這份來自山林間的感官盛宴。"], ["T3-17", "CLOUD SALAD 冷餐管家", "端藍酪務 Blauwerk Provision，由雲端沙拉有限公司 CLOUD SALAD SUPPLY 創立，專注於質感冷食、減醣備餐與企業健康餐飲。我們結合精選歐洲原塊奶酪、在地供應的舒肥義式雞胸肉，以及來自臺東海端鄉高海拔農場、正逐步轉型友善與有機耕作的契作甘藍，打造適合個人、家庭與企業使用的「質感宅配備餐方案」及「辦公室餐盒方案」。每週，新鮮高山甘藍從臺東海端運抵高雄加工，以高纖、具飽足感的蔬菜取代部分精製澱粉，搭配優質蛋白質與原塊奶酪，協助消費者更便利地實踐減醣飲控與均衡飲食。除了提供健康餐食，我們也希望透過穩定採購與產品設計，建立都會消費者與高山原住民族農業之間長期、可持續的價值交換。\n\n品牌由旅德創辦人 Su 與來自海端鄉的族人先生 Ibi 共同經營，並以象徵沉穩、包容與高端款待的深藍色作為核心識別。端藍酪務期待讓每一份餐食，不只是便利與營養，更成為支持高山農業有機轉型、地方創生與永續供應鏈的日常選擇。\n,"], ["T3-18", "共生咖啡", "共生咖啡 Symbiosis Cafe 位於高雄海邊路、高雄流行音樂中心旁，創立於 2022 年。我們以「共生」為品牌核心，希望透過咖啡、甜點與人之間的交流，打造一個讓城市與生活彼此連結的空間。\n品牌擅長以台灣在地水果、茶葉與咖啡結合，運用澄清、發酵等手法設計季節限定飲品，呈現層次豐富且具有記憶點的風味。同時也提供手作肉桂捲及特色甜點，讓每一次品嚐都成為完整的體驗。"], ["T3-19", "禾田food truck", "禾田food truck \n看名字是一台讓人霧裡看花的歐翼餐車；\n傳達老闆山姆這幾年在北、中、南屏、花東的星級飯店、餐廳、部落，遇過各國米其林主廚，\n結合展現山姆獨有的風格與野性，\n將會帶給山友們一個真性情的美味。"]],
  };
