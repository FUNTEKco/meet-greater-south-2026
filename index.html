      title: '展區與攤位名錄',
      doc: '展區與攤位名錄 — 2026 Meet Greater South 亞灣新創大南方',
      hint: '點展區看介紹與攤位名錄,右滑看放大地圖',
      legendTitle: '展區總覽', legendSub: '點選任一展區,即可在下方開啟介紹與攤位名錄。',
      share: '展區介紹與 244 家攤商名錄,點展區就看得到!',
      home: 'cx-01', other: 'stage', otherLabel: '看舞台節目表 ›'
    }
  };
  const vParam = (new URLSearchParams(location.search).get('view') || '').toLowerCase();
  const VIEW = VIEWS[vParam] ? vParam : 'all';
  const inView = z => VIEW === 'all' || z.type === VIEW;
  document.body.dataset.view = VIEW;

  if (VIEW !== 'all') {
    const v = VIEWS[VIEW];
    document.title = v.doc;
    $('.brand-mark .title').textContent = v.title;
    $('#hintText').textContent = v.hint;
    $('#legendTitle').textContent = v.legendTitle;
    $('#legend .sub').textContent = v.legendSub;
    const sw = $('#viewSwitch');
    sw.textContent = v.otherLabel; sw.href = `?view=${v.other}`; sw.hidden = false;
  }

  let current = null, currentDay = DAYS[0].key;
  const groups = {}, zlabels = {};

  // ---------- Build hotspot groups + hover labels ----------
  function buildSpot(z) {
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'zone-group');
    g.dataset.zone = z.key; g.setAttribute('tabindex', '0'); g.setAttribute('role', 'button');
    g.setAttribute('aria-label', `${z.name} ${z.nameEn},${z.type === 'stage' ? '查看節目表' : '查看展區介紹'}`);
    g.style.setProperty('--zc', z.color);
    z.polys.forEach(pts => { const p = document.createElementNS(SVGNS, 'polygon'); p.setAttribute('class', 'hit'); p.setAttribute('points', pts); g.appendChild(p); });
    overlay.appendChild(g); groups[z.key] = g;

    const lab = document.createElement('div');
    lab.className = 'zlabel'; lab.style.setProperty('--zc', z.color);
    lab.style.left = (z.label.x / VB.w * 100) + '%'; lab.style.top = (z.label.y / VB.h * 100) + '%';
    lab.innerHTML = `<span class="dot"></span>${z.code ? z.code + ' ' : ''}${z.name}<span class="go">${z.type === 'stage' ? '節目表 ›' : '介紹 ›'}</span>`;
    labelsEl.appendChild(lab); zlabels[z.key] = lab;

    const enter = () => { if (current !== z.key) zlabels[z.key].classList.add('show'); };
    const leave = () => zlabels[z.key].classList.remove('show');
    g.addEventListener('pointerenter', enter); g.addEventListener('pointerleave', leave);
    g.addEventListener('focus', enter); g.addEventListener('blur', leave);
  }
  STAGES.filter(inView).forEach(buildSpot); ZONES.filter(inView).forEach(buildSpot);

  // ---------- Legend ----------
  function buildLegendGroup(label, list) {
    if (label) { const gl = document.createElement('div'); gl.className = 'legend-group-label'; gl.textContent = label; legendList.appendChild(gl); }
    list.forEach(z => {
      const item = document.createElement('div');
      item.className = 'legend-item'; item.tabIndex = 0; item.setAttribute('role', 'button'); item.style.setProperty('--zc', z.color);
      item.innerHTML = `<span class="legend-swatch" style="background:${z.color}; color:${z.color};"></span>` +
        `<div><div class="legend-name">${z.code ? z.code + '｜' : ''}${z.name}</div><div class="legend-desc">${z.nameEn}</div></div>` +
        (z.type === 'stage' ? '<span class="legend-tag">節目表</span>' : '');
      const open = () => { legend.dataset.open = 'false'; openSpot(z.key); };
      item.addEventListener('click', open);
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      legendList.appendChild(item);
    });
  }
  const pick = keys => keys.map(k => ALL[k]);
  if (VIEW !== 'zone') buildLegendGroup(VIEW === 'stage' ? '' : '舞台與活動空間 · 節目表', STAGES);
  if (VIEW !== 'stage') {
    buildLegendGroup('產業主題專區 Industry Theme EXPO', pick(['cx-01','cx-02','cx-03','cx-04','cx-05','cx-06','cx-07','cx-08','ep-01','ep-02','ep-03']));
    buildLegendGroup('主題解方專區 Solutions', pick(['h','g','p','sig','e','f','s','m']));
    buildLegendGroup('特色專區 Featured', pick(['t','gp']));
  }

  // ---------- Content rendering ----------
  function playAnim() { panelBody.classList.remove('playing'); void panelBody.offsetWidth; panelBody.classList.add('playing'); }
  const langTags = arr => (arr || []).map(l => `<span class="lang ${l === 'EN' ? 'en' : 'zh'}">${l}</span>`).join('');

  function renderDayTabs(z) {
    dayTabs.innerHTML = '';
    DAYS.forEach(d => {
      const b = document.createElement('button');
      b.className = 'day-tab' + (d.key === currentDay ? ' active' : ''); b.dataset.day = d.key;
      b.innerHTML = `${d.key}<span class="dow">星期${d.dow}</span>`;
      b.addEventListener('click', () => { currentDay = d.key; renderSchedule(z); refreshTabs(); });
      dayTabs.appendChild(b);
    });
  }
  function refreshTabs() { dayTabs.querySelectorAll('.day-tab').forEach(b => b.classList.toggle('active', b.dataset.day === currentDay)); }
  function renderSchedule(z) {
    const items = (SCHEDULE[z.key] && SCHEDULE[z.key][currentDay]) || [];
    scheduleList.innerHTML = '';
    if (!items.length) { scheduleList.innerHTML = '<div class="sch-empty">本日於此舞台無安排場次</div>'; return; }
    items.forEach(it => {
      const el = document.createElement('div'); el.className = 'sch-item';
      el.innerHTML = `<div class="sch-time">${it.t}</div><div class="sch-main">` +
        `<div class="sch-title">${it.title}${langTags(it.lang)}</div>` +
        `${it.sub ? `<div class="sch-sub">${it.sub}</div>` : ''}</div>`;
      scheduleList.appendChild(el);
    });
  }
  // ---------- 攤位名錄:攤位編號 + 攤商名稱,點擊展開介紹 ----------
  // 名稱可能是多行(第一行為主,其餘是場域或品牌名),各佔一列
  function setLines(el, text) {
    el.innerHTML = '';
    String(text).split('\n').forEach(t => {
      const sp = document.createElement('span'); sp.textContent = t; el.appendChild(sp);
    });
  }
  function closeBoothDetail() {
    boothDetail.hidden = true;
    boothGrid.querySelectorAll('.booth-chip[aria-expanded="true"]')
      .forEach(b => b.setAttribute('aria-expanded', 'false'));
  }
  function toggleBoothDetail(chip, code, name, desc) {
    const wasOpen = chip.getAttribute('aria-expanded') === 'true';
    closeBoothDetail();
    if (wasOpen) return;                       // 再點一次收合
    chip.setAttribute('aria-expanded', 'true');
    bdCode.textContent = code;
    setLines(bdName, name);
    bdBody.innerHTML = '';
    String(desc).split(/\n+/).forEach(t => {
      t = t.trim(); if (!t) return;
      const para = document.createElement('p'); para.textContent = t; bdBody.appendChild(para);
    });
    chip.after(boothDetail);                   // 介紹卡緊接在該攤位下方,佔滿整列
    boothDetail.hidden = false;
    // 重新播放展開動畫(元素是重複使用的)
    boothDetail.style.animation = 'none'; void boothDetail.offsetWidth; boothDetail.style.animation = '';
    requestAnimationFrame(() => boothDetail.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  }
  function renderBooths(z) {
    const list = BOOTHS[z.key] || [];
    closeBoothDetail();
    boothGrid.querySelectorAll('.booth-chip').forEach(b => b.remove());
    if (!list.length) {
      // 主辦單位未提供名錄(CX-08)→ 退回原本的展區資訊條列
      zoneSectionLabel.textContent = '展區資訊';
      boothGrid.hidden = true; sheetHighlights.hidden = false;
      sheetHighlights.innerHTML = '';
      (z.highlights || []).forEach(h => {
        const el = document.createElement('div'); el.className = 'hl';
        el.innerHTML = `<span class="hl-dot"></span>${h}`;
        sheetHighlights.appendChild(el);
      });
      return;
    }
    sheetHighlights.hidden = true; boothGrid.hidden = false;
    const unit = z.key === 't' ? '組市集攤商' : '家參展商';
    zoneSectionLabel.innerHTML =
      `攤位名錄 · <span class="count">${list.length}</span> ${unit}<span class="tip">點攤位看介紹</span>`;
    list.forEach(([code, name, desc]) => {
      const b = document.createElement('button');
      b.className = 'booth-chip'; b.type = 'button';
      b.setAttribute('aria-expanded', 'false');
      b.innerHTML = '<span class="b-dot"></span><span class="b-text">' +
                    '<span class="b-code"></span><span class="b-name"></span></span>';
      b.querySelector('.b-code').textContent = code;
      setLines(b.querySelector('.b-name'), name);
      b.setAttribute('aria-label', `${code} ${name.replace(/\n/g, ' ')},查看攤商介紹`);
      b.addEventListener('click', () => toggleBoothDetail(b, code, name, desc));
      boothGrid.appendChild(b);
    });
    boothGrid.appendChild(boothDetail);         // 介紹卡永遠留在格子最後
  }
  $('#bdClose').addEventListener('click', closeBoothDetail);

  function firstDayWithSessions(key) { const f = DAYS.find(d => SCHEDULE[key] && SCHEDULE[key][d.key] && SCHEDULE[key][d.key].length); return f ? f.key : DAYS[0].key; }

  // ---------- Open spot (inline) ----------
  function openSpot(key, replace = true) {
    const z = ALL[key]; if (!z) return;
    Object.values(zlabels).forEach(l => l.classList.remove('show'));
    current = key;
    Object.entries(groups).forEach(([k, g]) => g.classList.toggle('active', k === key));

    document.documentElement.style.setProperty('--zc', z.color);
    $('.panel-inner').style.setProperty('--zc', z.color);
    sheetTitle.textContent = (z.code ? z.code + '｜' : '') + z.name;
    sheetTitleEn.textContent = z.nameEn;

    if (z.type === 'stage') {
      document.body.dataset.mode = 'stage';
      sheetEyebrow.textContent = '舞台與活動空間 · STAGE';
      currentDay = firstDayWithSessions(key);
      renderDayTabs(z); renderSchedule(z);
      setDotLabels(['節目表', '位置圖']);
    } else {
      document.body.dataset.mode = 'zone';
      sheetEyebrow.textContent = '展區 · ZONE';
      sheetBlurb.textContent = z.blurb;
      renderBooths(z);
      setDotLabels(['展區介紹', '放大地圖']);
    }
    zoneMapImg.src = `assets/zone-${key}.webp?v=0820`;
    zoneMapImg.alt = `${z.name} 位置放大圖`;
    jumpToPage(0); markDots(0);
    requestAnimationFrame(() => { jumpToPage(0); updateDots(); });
    playAnim();
    if (replace) history.replaceState({ spot: key }, '', '#spot=' + key);
  }

  // ---------- 2-page carousel (info + zoomed map) ----------
  // Jump instantly: an animated scroll on a `scroll-snap-type: mandatory`
  // container gets re-snapped back to the current page mid-flight in Chrome.
  // Touch swiping still animates natively.
  // markDots() is called here rather than left to the scroll listener, which
  // does not reliably fire for programmatic jumps.
  function scrollToPage(i) { carousel.scrollLeft = i * carousel.clientWidth; markDots(i); }
  const jumpToPage = scrollToPage;
  function markDots(idx) {
    [...carouselDots.children].forEach((d, i) => d.classList.toggle('active', i === idx));
    zoneMore.classList.toggle('off', idx !== 0);
  }
  function updateDots() { markDots(Math.round(carousel.scrollLeft / Math.max(1, carousel.clientWidth))); }
  ['資訊', '放大地圖'].forEach((lbl, i) => {
    const d = document.createElement('button'); d.className = 'cdot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', lbl);
    d.addEventListener('click', () => scrollToPage(i));
    carouselDots.appendChild(d);
  });
  function setDotLabels(labels) { [...carouselDots.children].forEach((d, i) => d.setAttribute('aria-label', labels[i])); }
  carousel.addEventListener('scroll', updateDots, { passive: true });
  zoneMore.addEventListener('click', () => scrollToPage(1));

  // ---------- Events ----------
  overlay.addEventListener('click', e => { const g = e.target.closest('.zone-group'); if (g) openSpot(g.dataset.zone); });
  overlay.addEventListener('keydown', e => { const g = e.target.closest('.zone-group'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSpot(g.dataset.zone); } });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (legend.dataset.open === 'true') legend.dataset.open = 'false';
    else if (!boothDetail.hidden) closeBoothDetail();
  });

  $('#btnLegend').addEventListener('click', () => legend.dataset.open = 'true');
  $('#legendClose').addEventListener('click', () => legend.dataset.open = 'false');
  legend.addEventListener('click', e => { if (e.target === legend) legend.dataset.open = 'false'; });

  // ---------- Share ----------
  let toastTimer = null;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200); }
  async function shareMap(extraText = '', spotKey = '') {
    const base = location.origin + location.pathname + (VIEW === 'all' ? '' : `?view=${VIEW}`);
    const url = spotKey ? `${base}#spot=${spotKey}` : base;
    const title = '2026 Meet Greater South 亞灣新創大南方 ' + (VIEW === 'all' ? '互動展區地圖' : VIEWS[VIEW].title);
    const text = extraText || (VIEW === 'all' ? '快來探索展區介紹與舞台節目表!' : VIEWS[VIEW].share);
    if (window.liff && liff.isInClient && liff.isInClient()) { try { await liff.shareTargetPicker([{ type:'text', text:`${title}\n${text}\n${url}` }]); return; } catch (err) {} }
    if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (err) { return; } }
    try { await navigator.clipboard.writeText(`${title} ${url}`); toast('連結已複製到剪貼簿'); } catch (err) { prompt('複製此連結分享:', url); }
  }
  $('#btnShare').addEventListener('click', () => shareMap('', current || ''));

  // ---------- Intro reveal + load ----------
  const baseImg = mapFrame.querySelector('.map-base');

  // Chrome can commit a frame before the map image finishes decoding and then
  // never repaint it — the frame stays blank even though the image is loaded.
  // Touching a paint-only property once the decode resolves forces the repaint.
  function repaintBase() {
    baseImg.style.opacity = '0.999';
    requestAnimationFrame(() => requestAnimationFrame(() => { baseImg.style.opacity = ''; }));
  }
  function ensurePainted() {
    (baseImg.decode ? baseImg.decode().catch(() => {}) : Promise.resolve()).then(repaintBase);
  }

  const markReady = () => { ensurePainted(); overlay.classList.add('intro'); setTimeout(() => overlay.classList.remove('intro'), 2600); };
  if (baseImg.complete) markReady(); else baseImg.addEventListener('load', markReady, { once: true });
  // the picked srcset candidate can change on resize/orientation change
  addEventListener('resize', ensurePainted, { passive: true });

  // default: open 日光舞台 (or deep-linked spot)
  const initKey = (location.hash.match(/spot=([a-z0-9-]+)/) || [])[1];
  const homeKey = VIEW === 'all' ? 'sunrise' : VIEWS[VIEW].home;
  openSpot((initKey && ALL[initKey] && inView(ALL[initKey])) ? initKey : homeKey);

  window.addEventListener('load', () => {
    if (window.liff) { const liffId = (document.documentElement.dataset.liffId || '').trim(); if (liffId) liff.init({ liffId }).catch(err => console.warn('LIFF init failed', err)); }
  });

  // ---------- Calibration mode (?cal=1) ----------
  if (new URLSearchParams(location.search).get('cal')) {
    const g = document.createElementNS(SVGNS, 'g'); g.setAttribute('class', 'cal-grid');
    for (let x = 0; x <= VB.w; x += 100) { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('x1', x); l.setAttribute('y1', 0); l.setAttribute('x2', x); l.setAttribute('y2', VB.h); if (x % 500 === 0) { l.setAttribute('class', 'major'); const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', x + 4); t.setAttribute('y', 40); t.textContent = x; g.appendChild(t); } g.appendChild(l); }
    for (let y = 0; y <= VB.h; y += 100) { const l = document.createElementNS(SVGNS, 'line'); l.setAttribute('x1', 0); l.setAttribute('y1', y); l.setAttribute('x2', VB.w); l.setAttribute('y2', y); if (y % 500 === 0) { l.setAttribute('class', 'major'); const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', 4); t.setAttribute('y', y - 6); t.textContent = y; g.appendChild(t); } g.appendChild(l); }
    overlay.appendChild(g);
    let buf = [];
    overlay.addEventListener('click', e => { const r = overlay.getBoundingClientRect(); const x = Math.round((e.clientX - r.left) / r.width * VB.w); const y = Math.round((e.clientY - r.top) / r.height * VB.h); buf.push(`${x},${y}`); console.log('point:', x, y, '| poly:', '"' + buf.join(' ') + '"'); }, true);
    window.calReset = () => { buf = []; console.log('cal buffer reset'); };
    console.log('Calibration mode ON. Click to log coords.');
  }
})();
</script>
</body>
</html>
